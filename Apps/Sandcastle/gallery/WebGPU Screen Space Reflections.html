<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="WebGPU screen-space reflections (SSR). Tunable max distance, thickness, ray-march steps, stride, and reflection strength."
    />
    <meta name="cesium-sandcastle-labels" content="WebGPU, Showcases, Post Processing" />
    <title>Cesium Demo</title>
    <script type="text/javascript" src="../Sandcastle-header.js"></script>
    <script
      type="text/javascript"
      src="../../../Build/CesiumUnminified/Cesium.js"
      nomodule
    ></script>
    <script type="module" src="../load-cesium-es6.js"></script>
  </head>
  <!--
    WebGPU Screen-Space Reflections demo.

    Demonstrates `scene.enableSSR` — the WebGPU SSR post-process. The
    effect ray-marches in screen space against the depth buffer to
    approximate reflective surfaces. Without a normal G-buffer (which
    is gated on FEAT-GAP-01 deferred work), it falls back to depth-
    derivative normals; expect noisier reflections than a deferred
    pipeline would produce, but the technique is fully functional.

    No WebGL implementation exists; this is a WebGPU-exclusive effect.
  -->
  <body class="sandcastle-loading" data-sandcastle-bucket="bucket-requirejs.html">
    <style>
      @import url(../templates/bucket.css);
    </style>
    <div id="cesiumContainer" class="fullSize"></div>
    <div id="loadingOverlay"><h1>Loading...</h1></div>
    <div id="toolbar">
      <table>
        <tbody>
          <tr>
            <td>Enable SSR</td>
            <td><input type="checkbox" data-bind="checked: enabled" /></td>
          </tr>
          <tr>
            <td>Max Distance</td>
            <td>
              <input
                type="range"
                min="10"
                max="200"
                step="1"
                data-bind="value: maxDistance, valueUpdate: 'input'"
              />
              <span data-bind="text: maxDistance"></span>
            </td>
          </tr>
          <tr>
            <td>Thickness</td>
            <td>
              <input
                type="range"
                min="0.05"
                max="2.0"
                step="0.01"
                data-bind="value: thickness, valueUpdate: 'input'"
              />
              <span data-bind="text: thickness"></span>
            </td>
          </tr>
          <tr>
            <td>Max Steps</td>
            <td>
              <input
                type="range"
                min="16"
                max="128"
                step="1"
                data-bind="value: maxSteps, valueUpdate: 'input'"
              />
              <span data-bind="text: maxSteps"></span>
            </td>
          </tr>
          <tr>
            <td>Stride</td>
            <td>
              <input
                type="range"
                min="1"
                max="8"
                step="0.1"
                data-bind="value: stride, valueUpdate: 'input'"
              />
              <span data-bind="text: stride"></span>
            </td>
          </tr>
          <tr>
            <td>Reflection Strength</td>
            <td>
              <input
                type="range"
                min="0"
                max="1"
                step="0.01"
                data-bind="value: reflectionStrength, valueUpdate: 'input'"
              />
              <span data-bind="text: reflectionStrength"></span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <script id="cesium_sandcastle_script">
      window.startup = async function (Cesium) {
        "use strict";
        //Sandcastle_Begin

        const viewer = await Cesium.Viewer.createAsync("cesiumContainer", {
          contextOptions: { renderer: "webgpu" },
        });

        const viewModel = {
          enabled: true,
          maxDistance: 50,
          thickness: 0.5,
          maxSteps: 64,
          stride: 2.0,
          reflectionStrength: 0.5,
        };

        function applySSR() {
          const scene = viewer.scene;
          scene.enableSSR = Boolean(viewModel.enabled);
          scene.ssrMaxDistance = Number(viewModel.maxDistance);
          scene.ssrThickness = Number(viewModel.thickness);
          scene.ssrMaxSteps = Math.round(Number(viewModel.maxSteps));
          scene.ssrStride = Number(viewModel.stride);
          scene.ssrReflectionStrength = Number(viewModel.reflectionStrength);
          scene.requestRender();
        }

        Cesium.knockout.track(viewModel);
        const toolbar = document.getElementById("toolbar");
        Cesium.knockout.applyBindings(viewModel, toolbar);
        for (const name in viewModel) {
          if (Object.prototype.hasOwnProperty.call(viewModel, name)) {
            Cesium.knockout.getObservable(viewModel, name).subscribe(applySSR);
          }
        }
        applySSR();

        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(-122.4, 37.78, 1500),
          orientation: {
            heading: Cesium.Math.toRadians(0),
            pitch: Cesium.Math.toRadians(-25),
          },
        });

        //Sandcastle_End
        Sandcastle.finishedLoading();
      };
      if (typeof Cesium !== "undefined") {
        window.startupCalled = true;
        window.startup(Cesium).catch((error) => {
          "use strict";
          console.error(error);
        });
      }
    </script>
  </body>
</html>
