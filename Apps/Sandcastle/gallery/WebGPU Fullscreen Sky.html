<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="WebGPU view-independent fullscreen sky atmosphere. Toggle between the ellipsoid-shell sky (WebGL-parity default) and a fullscreen-pass sky that reconstructs the per-pixel view ray, and sweep the time of day to watch the atmosphere go from blue day to dark night with the stars showing through. WebGPU only."
    />
    <meta
      name="cesium-sandcastle-labels"
      content="WebGPU, Showcases, Atmosphere"
    />
    <title>Cesium Demo</title>
    <script type="text/javascript" src="../Sandcastle-header.js"></script>
    <script
      type="text/javascript"
      src="../../../Build/CesiumUnminified/Cesium.js"
      nomodule
    ></script>
    <script type="module" src="../load-cesium-es6.js"></script>
  </head>
  <!--
    WebGPU Fullscreen Sky demo.

    The WebGPU sky atmosphere ships two render paths, selectable per-Viewer via
    `scene.skyAtmosphere._webgpuFullscreen`:

      • Shell (default) — a scaled-ellipsoid mesh, the WebGL-parity path. Each
        fragment's view ray comes from the interpolated shell vertex.
      • Fullscreen — one screen-covering triangle; each fragment reconstructs its
        world-space view ray from the inverse view/projection (the same trick the
        WebGPU cloud renderer uses). View-independent — no mesh, no coverage gaps.

    Both call the identical scattering (`skyColorForRay`), so they match; the
    fullscreen path is an alternative that avoids the shell mesh entirely. This
    demo enables dynamic atmosphere lighting so the time-of-day slider shows the
    sky darken to night and the star field show through near the ground.

    WebGPU-only: the fullscreen path + the procedural clouds only exist on the
    WebGPU backend; the Viewer is pinned to it via contextOptions.
  -->
  <body
    class="sandcastle-loading"
    data-sandcastle-bucket="bucket-requirejs.html"
  >
    <style>
      @import url(../templates/bucket.css);

      #skyPanel {
        position: absolute;
        top: 5px;
        left: 5px;
        width: 250px;
        padding: 8px 10px 10px;
        background: rgba(28, 30, 34, 0.88);
        border-radius: 6px;
        color: #eee;
        font-family: sans-serif;
        font-size: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      }
      #skyPanel h2 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }
      #skyPanel .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 6px 0;
      }
      #skyPanel .row label {
        flex: 1 1 auto;
        margin-right: 6px;
      }
      #skyPanel input[type="range"] {
        width: 110px;
        vertical-align: middle;
      }
      #skyPanel .val {
        display: inline-block;
        min-width: 40px;
        text-align: right;
        margin-left: 6px;
        color: #cfe3ff;
        font-variant-numeric: tabular-nums;
      }
      #skyPanel .hint {
        margin-top: 8px;
        font-size: 11px;
        color: #9ec5ff;
        line-height: 1.35;
      }
    </style>
    <div id="cesiumContainer" class="fullSize"></div>
    <div id="loadingOverlay"><h1>Loading...</h1></div>
    <div id="skyPanel"></div>
    <div id="toolbar"></div>
    <script id="cesium_sandcastle_script">
      /* global Cesium, Sandcastle */
      window.startup = async function (Cesium) {
        //Sandcastle_Begin

        // Fullscreen sky + procedural clouds are WebGPU-only, so pin the backend.
        const viewer = await Cesium.Viewer.createAsync("cesiumContainer", {
          contextOptions: { renderer: "webgpu" },
        });
        const scene = viewer.scene;
        const globe = scene.globe;
        window.viewer = viewer; // expose for console tinkering

        scene.skyAtmosphere.show = true;
        scene.skyBox.show = true;

        // Enable dynamic atmosphere lighting so the sky does a real day/night
        // cycle — without it the atmosphere is a static "always lit from above"
        // dome (bright at any hour) and the stars never show.
        globe.enableLighting = true;
        globe.dynamicAtmosphereLighting = true;
        if (scene.atmosphere) {
          scene.atmosphere.dynamicLighting =
            Cesium.DynamicAtmosphereLightingType.SUNLIGHT;
        }

        // Start with the FULLSCREEN sky path on (the subject of this demo).
        scene.skyAtmosphere._webgpuFullscreen = true;

        // Near-ground oblique view over the central US so the sky fills the
        // upper frame and the day/night transition reads clearly.
        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(-95.0, 39.0, 1800.0),
          orientation: {
            heading: Cesium.Math.toRadians(90.0),
            pitch: Cesium.Math.toRadians(10.0),
            roll: 0.0,
          },
        });

        function setHourUtc(hour) {
          const h = Math.floor(hour);
          const m = Math.round((hour - h) * 60);
          const iso = `2026-06-21T${String(h).padStart(2, "0")}:${String(
            m,
          ).padStart(2, "0")}:00Z`;
          const t = Cesium.JulianDate.fromIso8601(iso);
          viewer.clock.currentTime = t.clone();
          viewer.clock.shouldAnimate = false;
          scene.requestRender();
        }

        // ── control panel (plain DOM so it works without the Sandcastle UI) ──
        const panel = document.getElementById("skyPanel");
        const heading = document.createElement("h2");
        heading.textContent = "WebGPU Sky";
        panel.appendChild(heading);

        function addToggle(labelText, initial, onChange) {
          const row = document.createElement("div");
          row.className = "row";
          const label = document.createElement("label");
          label.textContent = labelText;
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = initial;
          input.addEventListener("change", () => {
            onChange(input.checked);
            scene.requestRender();
          });
          row.appendChild(label);
          row.appendChild(input);
          panel.appendChild(row);
          return input;
        }

        function addSlider(labelText, min, max, step, initial, onInput) {
          const row = document.createElement("div");
          row.className = "row";
          const label = document.createElement("label");
          label.textContent = labelText;
          const input = document.createElement("input");
          input.type = "range";
          input.min = min;
          input.max = max;
          input.step = step;
          input.value = initial;
          const val = document.createElement("span");
          val.className = "val";
          val.textContent = Number(initial).toFixed(2);
          input.addEventListener("input", () => {
            const v = Number(input.value);
            val.textContent = v.toFixed(2);
            onInput(v);
            scene.requestRender();
          });
          row.appendChild(label);
          row.appendChild(input);
          row.appendChild(val);
          panel.appendChild(row);
          return input;
        }

        addToggle("Fullscreen sky path", true, (on) => {
          scene.skyAtmosphere._webgpuFullscreen = on;
        });
        addSlider("Time of day (UTC h)", 0, 24, 0.25, 18, (h) => setHourUtc(h));
        addToggle("Procedural clouds", false, (on) => {
          globe.defaultCloudCollection.enableVolumetric = on;
          if (on) {
            globe.defaultCloudCollection.volumetric.cloudCoverage = 0.45;
            globe.defaultCloudCollection.volumetric.cloudDensity = 0.3;
          }
        });

        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent =
          "Toggle the fullscreen vs shell sky path — they match. " +
          "Slide to ~6 (UTC) for local night: the sky darkens and the stars " +
          "show through.";
        panel.appendChild(hint);

        setHourUtc(18);

        //Sandcastle_End
        Sandcastle.finishedLoading();
      };
      if (typeof Cesium !== "undefined") {
        window.startupCalled = true;
        window.startup(Cesium).catch((error) => {
          console.error(error);
        });
      }
    </script>
  </body>
</html>
