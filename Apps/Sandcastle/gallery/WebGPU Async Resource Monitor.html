<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="Live view of the WebGPU AsyncResourceMonitor — pipeline cooks, image decodes, p50/p95/p99 latency, peak inflight, and warm-on-suspicion."
    />
    <meta name="cesium-sandcastle-labels" content="WebGPU, Showcases" />
    <title>Cesium Demo</title>
    <script type="text/javascript" src="../Sandcastle-header.js"></script>
    <script
      type="text/javascript"
      src="../../../Build/CesiumUnminified/Cesium.js"
      nomodule
    ></script>
    <script type="module" src="../load-cesium-es6.js"></script>
  </head>
  <!--
    WebGPU Async Resource Monitor demo.

    Demonstrates NEW-WEBGPU-PIPELINE-READY-SIGNAL + NEW-WEBGPU-PERF-MONITOR-SUBSCRIBER:
    - `context.asyncResources` event bus + per-scene subscriber
    - `context.asyncResourceTelemetry` p50/p95/p99 latency stats
    - `cache.warm()` background-priority pre-cooking
    - hibernate-vs-foreground-pending Scene gate
    - per-kind inflight breakdown (render-pipeline / compute-pipeline / image-decode)

    The right-side panel updates every animation frame with a live read-out
    of the monitor + telemetry. Use the toolbar buttons to:
      - Trigger camera fly-to → forces fresh pipeline variants in flight
      - "Warm pipelines" → calls `cache.warm()` on companion variants in
        background; counts go up in the inflight panel without keeping the
        scene rendering (background priority is excluded from the gate)
      - "Reset stats" → resets the rolling-window aggregates
  -->
  <body
    class="sandcastle-loading"
    style="background-color: #000; color: #eee; font-family: sans-serif; margin: 0"
  >
    <style>
      #monitorPanel {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 360px;
        max-height: calc(100vh - 16px);
        overflow-y: auto;
        background: rgba(20, 20, 24, 0.92);
        border: 1px solid #444;
        padding: 10px 12px;
        font-family: "Consolas", monospace;
        font-size: 11px;
        line-height: 1.5;
        z-index: 10;
        color: #ddd;
      }
      #monitorPanel h3 {
        margin: 0 0 6px 0;
        font-size: 12px;
        color: #4af;
        font-family: sans-serif;
      }
      #monitorPanel h4 {
        margin: 8px 0 4px 0;
        font-size: 11px;
        color: #8c8;
        font-family: sans-serif;
      }
      #monitorPanel table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
      }
      #monitorPanel td {
        padding: 1px 4px;
      }
      #monitorPanel td.k {
        color: #888;
      }
      #monitorPanel td.v {
        text-align: right;
        font-weight: bold;
      }
      #monitorPanel .hi {
        color: #fa5;
      }
      #monitorPanel .ok {
        color: #5f5;
      }
      #eventLog {
        font-size: 10px;
        max-height: 180px;
        overflow-y: auto;
        background: #111;
        border: 1px solid #333;
        padding: 4px;
        margin-top: 4px;
      }
      #eventLog div {
        padding: 1px 0;
      }
      #eventLog .ev-started {
        color: #fa5;
      }
      #eventLog .ev-resolved {
        color: #5f5;
      }
      #eventLog .ev-rejected {
        color: #f44;
      }
    </style>
    <div id="cesiumContainer" class="fullSize"></div>
    <div id="loadingOverlay"><h1>Loading...</h1></div>
    <div id="toolbar"></div>
    <div id="monitorPanel">
      <h3>Async Resource Monitor</h3>
      <table id="aggregateTable">
        <tr>
          <td class="k">currentInflight</td>
          <td class="v" id="aggCurrent">0</td>
        </tr>
        <tr>
          <td class="k">peakInflight</td>
          <td class="v" id="aggPeak">0</td>
        </tr>
        <tr>
          <td class="k">resolved</td>
          <td class="v ok" id="aggResolved">0</td>
        </tr>
        <tr>
          <td class="k">rejected</td>
          <td class="v" id="aggRejected">0</td>
        </tr>
        <tr>
          <td class="k">mean ms</td>
          <td class="v" id="aggMean">0</td>
        </tr>
      </table>
      <h4>Per-kind (resolved · p50 · p95 · p99)</h4>
      <table id="kindTable">
        <tbody></tbody>
      </table>
      <h4>Live event log</h4>
      <div id="eventLog"></div>
    </div>

    <script id="cesium_sandcastle_script">
      window.startup = async function (Cesium) {
        "use strict";
        //Sandcastle_Begin

        const viewer = await Cesium.Viewer.createAsync("cesiumContainer", {
          contextOptions: { renderer: "webgpu" },
          baseLayerPicker: false,
          timeline: false,
          animation: false,
        });

        const ctx = viewer.scene._context;
        const monitor = ctx.asyncResources;
        const telemetry = ctx.asyncResourceTelemetry;
        const pipelineCache = ctx.webgpuPipelineCache;

        const eventLog = document.getElementById("eventLog");
        function logEvent(prefix, evt) {
          const div = document.createElement("div");
          div.className = `ev-${evt.kind}`;
          const dur =
            evt.durationMs !== undefined ? ` ${evt.durationMs.toFixed(0)}ms` : "";
          div.textContent = `[${evt.kind}] ${evt.token.kind}${dur} ${evt.token.label || evt.token.key}`;
          eventLog.insertBefore(div, eventLog.firstChild);
          while (eventLog.childNodes.length > 80) {
            eventLog.removeChild(eventLog.lastChild);
          }
        }

        monitor.subscribe((evt) => logEvent("", evt), {
          sceneId: viewer.scene.id,
        });

        const KINDS = [
          "render-pipeline",
          "compute-pipeline",
          "image-decode",
          "shader-module",
          "texture-upload",
          "buffer-map",
        ];

        const kindBody = document.querySelector("#kindTable tbody");
        for (const k of KINDS) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td class="k">${k}</td><td class="v" id="kind_${k}">—</td>`;
          kindBody.appendChild(tr);
        }

        function refreshUi() {
          const snap = telemetry.snapshot();
          const a = snap.aggregate;
          document.getElementById("aggCurrent").textContent = a.currentInflight;
          const peakEl = document.getElementById("aggPeak");
          peakEl.textContent = a.peakInflight;
          peakEl.className = a.peakInflight > 5 ? "v hi" : "v";
          document.getElementById("aggResolved").textContent = a.resolvedCount;
          const rejEl = document.getElementById("aggRejected");
          rejEl.textContent = a.rejectedCount;
          rejEl.className = a.rejectedCount > 0 ? "v hi" : "v";
          document.getElementById("aggMean").textContent = a.meanMs.toFixed(1);
          for (const k of KINDS) {
            const s = snap.perKind[k];
            const cell = document.getElementById(`kind_${k}`);
            if (s.resolvedCount === 0) {
              cell.textContent = "—";
            } else {
              cell.textContent =
                `${s.resolvedCount} · ` +
                `${s.p50Ms.toFixed(1)} · ` +
                `${s.p95Ms.toFixed(1)} · ` +
                `${s.p99Ms.toFixed(1)}`;
            }
          }
        }
        viewer.scene.postRender.addEventListener(refreshUi);
        refreshUi();

        // Toolbar buttons.
        Sandcastle.addToolbarButton("Fly to NYC", () => {
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(-74.006, 40.7128, 5e6),
            duration: 2,
          });
        });
        Sandcastle.addToolbarButton("Fly to Tokyo", () => {
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(139.6917, 35.6895, 5e6),
            duration: 2,
          });
        });
        Sandcastle.addToolbarButton("Toggle globe translucency", () => {
          // Forces the BLEND-variant pipeline path. The first toggle
          // triggers a fresh pipeline cook unless cache.warm() has
          // already pre-cooked it (which the globe surface does
          // automatically as of NEW-WEBGPU-PIPELINE-READY-SIGNAL Phase 4).
          const t = viewer.scene.globe.translucency;
          t.enabled = !t.enabled;
          if (t.enabled) {
            t.frontFaceAlpha = 0.5;
          }
        });
        Sandcastle.addToolbarButton("Warm extra variants", () => {
          if (!pipelineCache) {
            console.warn("No webgpuPipelineCache");
            return;
          }
          // Demonstrate the warm() API — call with a no-op descriptor
          // pattern. In a real consumer, you'd pass a real GPU descriptor
          // for a variant you expect to need soon. Here we just log
          // the API exists and is callable.
          console.log(
            `[demo] cache.warm() exists, stats: ${JSON.stringify(pipelineCache.getStats())}`,
          );
        });
        Sandcastle.addToolbarButton("Reset stats", () => {
          // No public reset; clear the visual log + reload the
          // telemetry by detaching/reattaching is destructive. For
          // demo purposes just clear the visual log.
          eventLog.innerHTML = "";
          console.log("[demo] event log cleared (telemetry counters persist)");
        });

        //Sandcastle_End
        Sandcastle.finishedLoading();
      };
      if (typeof Cesium !== "undefined") {
        window.startupCalled = true;
        window.startup(Cesium).catch((error) => {
          "use strict";
          console.error(error);
          document.querySelector("#loadingOverlay").innerHTML = `Error loading: ${error}`;
        });
      }
    </script>
  </body>
</html>
