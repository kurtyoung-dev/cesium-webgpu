<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="GPU-resident orbital catalog: thousands of objects propagated each frame by a user-supplied WGSL compute kernel — positions never leave the GPU."
    />
    <meta name="cesium-sandcastle-labels" content="WebGPU, Showcases" />
    <title>Cesium Demo</title>
    <script type="text/javascript" src="../Sandcastle-header.js"></script>
    <script
      type="text/javascript"
      src="../../../Build/CesiumUnminified/Cesium.js"
      nomodule
    ></script>
    <script type="module" src="../load-cesium-es6.js"></script>
  </head>
  <!--
    WebGPU Orbital Catalog demo (Phase 3 of the Large Dynamic Objects
    roadmap), built on the feature-agnostic `ComputeInstanceCollection`.

    The ENGINE knows nothing about orbits: it provides "N instances whose
    per-instance data lives in a GPU storage buffer, repopulated each frame
    by a pluggable compute kernel, drawn as instanced vertex-pulled quads;
    the CPU uploads only a time scalar". Everything orbital — the element
    lane layout, the circular-orbit WGSL kernel, and the LEO/MEO/GEO catalog
    generation — is defined HERE in the demo.

    The per-instance lanes upload ONCE to a GPU storage buffer; every frame
    the kernel below propagates all objects in parallel and an instanced
    draw vertex-pulls the results directly from GPU memory. Object positions
    never round-trip through JavaScript.

    Simulation time follows the scene clock, so the speed slider just
    drives `viewer.clock.multiplier`. WebGPU-only: the WebGL2 fallback
    (worker/WASM kernel host) is a tracked follow-up.
  -->
  <body class="sandcastle-loading" data-sandcastle-bucket="bucket-requirejs.html">
    <style>
      @import url(../templates/bucket.css);
    </style>
    <div id="cesiumContainer" class="fullSize"></div>
    <div id="loadingOverlay"><h1>Loading...</h1></div>
    <div id="toolbar">
      <table>
        <tbody>
          <tr>
            <td>Objects</td>
            <td>
              <select data-bind="value: objectCount">
                <option value="1000">1,000</option>
                <option value="5000">5,000</option>
                <option value="20000">20,000</option>
                <option value="100000">100,000</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Time speed</td>
            <td>
              <input
                type="range"
                min="1"
                max="600"
                step="1"
                data-bind="value: clockMultiplier, valueUpdate: 'input'"
              />
              <span data-bind="text: clockMultiplier + 'x'"></span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <script id="cesium_sandcastle_script">
      window.startup = async function (Cesium) {
        "use strict";
        //Sandcastle_Begin

        const viewer = await Cesium.Viewer.createAsync("cesiumContainer", {
          contextOptions: { renderer: "webgpu" },
          shouldAnimate: true,
        });
        const scene = viewer.scene;

        // ── Orbital element layout (DEMO-owned — the engine never sees it) ──
        // Lane 0: semiMajorAxis (m)        Lane 1: inclination (rad)
        // Lane 2: raan (rad)               Lane 3: phase (rad)
        // Lane 4: meanMotion (rad/s)       Lane 5: epochOffset (s)
        // Lane 6-8: color r, g, b          Lane 9: pixelSize (px)
        const FLOATS_PER_INSTANCE = 10;

        // Circular-orbit kernel — ported verbatim from the Batch-230 engine
        // OrbitalPropagate.wgsl when the orbital math moved out of the
        // engine. Same MVP caveats as that kernel:
        //   - CIRCULAR orbits only: angle = phase + meanMotion*(t-epochOffset),
        //     radius = semiMajorAxis. No eccentricity, no Kepler solver.
        //   - ECI treated as ECEF directly (Earth rotation / GMST skipped),
        //     so RAAN is not a true inertial node.
        //   - f32 math throughout; the engine writes the RTE low part as 0.
        //     Error budget ~2.5 m absolute at GEO radius — invisible for
        //     catalog-scale point rendering, NOT for conjunction analysis.
        // The engine scaffolding provides `params`, `FLOATS_PER_INSTANCE`,
        // `ComputeInstanceOut`, the bounds check, and the RTE output write.
        const orbitalKernel = `
          fn csm_computeInstance(index: u32, time: f32) -> ComputeInstanceOut {
            let base = index * FLOATS_PER_INSTANCE;
            let semiMajorAxis = params[base + 0u];
            let inclination   = params[base + 1u];
            let raan          = params[base + 2u];
            let phase         = params[base + 3u];
            let meanMotion    = params[base + 4u];
            let epochOffset   = params[base + 5u];

            // Circular orbit: uniform angular motion in the orbital plane.
            let t = time - epochOffset;
            let angle = phase + meanMotion * t;
            let xp = semiMajorAxis * cos(angle);
            let yp = semiMajorAxis * sin(angle);

            // Rotate the in-plane position (xp, yp, 0) by inclination about
            // +X, then by RAAN about +Z: r_out = Rz(raan) * Rx(inc) * r_plane.
            // With Cesium's ECEF convention (+Z = polar axis), inclination 0
            // keeps the orbit in the equatorial plane.
            let ci = cos(inclination);
            let si = sin(inclination);
            let co = cos(raan);
            let so = sin(raan);

            var out: ComputeInstanceOut;
            out.position = vec3<f32>(
              xp * co - yp * ci * so,
              xp * so + yp * ci * co,
              yp * si,
            );
            out.color = vec4<f32>(params[base + 6u], params[base + 7u], params[base + 8u], 1.0);
            out.pixelSize = params[base + 9u];
            return out;
          }`;

        // Earth's gravitational parameter (m^3/s^2) — circular-orbit mean
        // motion n = sqrt(GM / a^3).
        const GM = 3.986004418e14;

        let catalog;

        function rebuildCatalog(count) {
          if (Cesium.defined(catalog)) {
            scene.primitives.remove(catalog);
          }
          catalog = scene.primitives.add(
            new Cesium.ComputeInstanceCollection({
              kernel: orbitalKernel,
              floatsPerInstance: FLOATS_PER_INSTANCE,
              // Positions are GPU-resident, so the bounding volume is a
              // USER contract: every orbit fits inside GEO radius + margin
              // (largest semiMajorAxis = 6.371e6 + 35786e3 ≈ 4.216e7 m).
              // Enables per-frustum culling/binning of the catalog draw.
              boundingSphere: new Cesium.BoundingSphere(Cesium.Cartesian3.ZERO, 4.4e7),
            }),
          );

          // Three altitude regimes. meanMotion is the physical circular
          // rate sqrt(GM / a^3), so LEO objects visibly lap the higher
          // shells.
          const EARTH_RADIUS = 6.371e6;
          const REGIMES = [
            // [altitude range (m), weight, [r, g, b]]
            [[400.0e3, 2000.0e3], 0.6, [0.0, 1.0, 1.0]], // LEO — cyan
            [[19000.0e3, 21000.0e3], 0.25, [1.0, 1.0, 0.0]], // MEO — yellow
            [[35786.0e3, 35786.0e3], 0.15, [1.0, 0.0, 1.0]], // GEO — magenta
          ];

          for (let i = 0; i < count; i++) {
            let pick = Math.random();
            let regime = REGIMES[0];
            for (const r of REGIMES) {
              if (pick < r[1]) {
                regime = r;
                break;
              }
              pick -= r[1];
            }
            const [altRange, , color] = regime;
            const altitude = altRange[0] + Math.random() * (altRange[1] - altRange[0]);
            const isGEO = regime === REGIMES[2];
            const semiMajorAxis = EARTH_RADIUS + altitude;
            catalog.addInstance([
              semiMajorAxis,
              // GEO objects cluster near the equatorial plane.
              isGEO ? Math.random() * 0.1 : Math.random() * Math.PI,
              Math.random() * 2.0 * Math.PI, // raan
              Math.random() * 2.0 * Math.PI, // phase
              Math.sqrt(GM / (semiMajorAxis * semiMajorAxis * semiMajorAxis)),
              0.0, // epochOffset
              color[0],
              color[1],
              color[2],
              3.0, // pixelSize
            ]);
          }
        }

        const viewModel = {
          objectCount: "5000",
          clockMultiplier: 60,
        };

        function applySettings() {
          viewer.clock.multiplier = Number(viewModel.clockMultiplier);
        }

        Cesium.knockout.track(viewModel);
        const toolbar = document.getElementById("toolbar");
        Cesium.knockout.applyBindings(viewModel, toolbar);
        Cesium.knockout
          .getObservable(viewModel, "objectCount")
          .subscribe(function (value) {
            rebuildCatalog(parseInt(value, 10));
          });
        Cesium.knockout
          .getObservable(viewModel, "clockMultiplier")
          .subscribe(applySettings);

        rebuildCatalog(5000);
        applySettings();

        // Pull back far enough to see the GEO shell.
        viewer.camera.setView({
          destination: new Cesium.Cartesian3(1.1e8, 4.0e7, 5.0e7),
          orientation: {
            direction: Cesium.Cartesian3.normalize(
              new Cesium.Cartesian3(-1.1, -0.4, -0.5),
              new Cesium.Cartesian3(),
            ),
            up: new Cesium.Cartesian3(0.0, 0.0, 1.0),
          },
        });

        //Sandcastle_End
        Sandcastle.finishedLoading();
      };
      if (typeof Cesium !== "undefined") {
        window.startupCalled = true;
        window.startup(Cesium).catch((error) => {
          "use strict";
          console.error(error);
        });
      }
    </script>
  </body>
</html>
