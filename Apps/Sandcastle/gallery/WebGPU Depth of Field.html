<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="WebGPU Depth-of-Field demo. Wires the upstream DoF stage through the WebGPU PostProcess pipeline (Batch 98 detection fix)."
    />
    <meta name="cesium-sandcastle-labels" content="WebGPU, Post Processing" />
    <title>Cesium Demo</title>
    <script type="text/javascript" src="../Sandcastle-header.js"></script>
    <script
      type="text/javascript"
      src="../../../Build/CesiumUnminified/Cesium.js"
      nomodule
    ></script>
    <script type="module" src="../load-cesium-es6.js"></script>
  </head>
  <body
    class="sandcastle-loading"
    data-sandcastle-bucket="bucket-requirejs.html"
  >
    <style>
      @import url(../templates/bucket.css);
    </style>
    <div id="cesiumContainer" class="fullSize"></div>
    <div id="loadingOverlay"><h1>Loading...</h1></div>
    <div id="toolbar">
      <table>
        <tbody>
          <tr>
            <td>DoF</td>
            <td><input type="checkbox" data-bind="checked: show" /></td>
          </tr>
          <tr>
            <td>Focal distance (m)</td>
            <td>
              <input
                type="range"
                min="1"
                max="200"
                step="0.5"
                data-bind="value: focalDistance, valueUpdate: 'input'"
              />
            </td>
          </tr>
          <tr>
            <td>Delta</td>
            <td>
              <input
                type="range"
                min="0.1"
                max="5"
                step="0.05"
                data-bind="value: delta, valueUpdate: 'input'"
              />
            </td>
          </tr>
          <tr>
            <td>Sigma</td>
            <td>
              <input
                type="range"
                min="1"
                max="20"
                step="0.1"
                data-bind="value: sigma, valueUpdate: 'input'"
              />
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <script id="cesium_sandcastle_script">
      window.startup = async function (Cesium) {
        "use strict";
        //Sandcastle_Begin
        // Force the WebGPU backend so this demo always exercises the
        // WebGPU PostProcess pipeline + DoF wiring landed in Batch 98.
        // (Without this, the AUTO renderer might pick WebGL and the
        // demo would silently route through the upstream GL path.)
        //
        // `createAsync`, not `new Viewer`: adapter and device acquisition are
        // asynchronous, so the synchronous constructor rejects an explicit
        // WebGPU request outright — `getSynchronousRendererType` throws a
        // DeveloperError before any Viewer state is built, and the demo never
        // starts. Every other WebGPU demo in this gallery already awaits
        // `Viewer.createAsync`; this one was the last synchronous holdout.
        const viewer = await Cesium.Viewer.createAsync("cesiumContainer", {
          contextOptions: { renderer: "webgpu" },
        });

        // Place a row of balloons at varying near-camera distances so
        // the focal-distance slider sweeps through them visibly.
        function createModel(url, x, y, height) {
          const position = Cesium.Cartesian3.fromDegrees(x, y, height);
          viewer.entities.add({
            name: url,
            position: position,
            model: { uri: url },
          });
        }

        const numberOfBalloons = 13;
        const lonIncrement = 0.00025;
        const initialLon = -122.99875;
        const lat = 44.0503706;
        const height = 100.0;
        const url = "../../SampleData/models/CesiumBalloon/CesiumBalloon.glb";
        for (let i = 0; i < numberOfBalloons; ++i) {
          createModel(url, initialLon + i * lonIncrement, lat, height);
        }

        // Build the DoF composite via the upstream library and add it
        // to the collection — the WebGPU side (Batch 98) detects it by
        // the well-known name `czm_depth_of_field` and routes to its
        // native WebGPU DoF effect (WebGPUDepthOfFieldEffect.ts).
        const dof = Cesium.PostProcessStageLibrary.createDepthOfFieldStage();
        viewer.scene.postProcessStages.add(dof);

        const viewModel = {
          show: true,
          focalDistance: 50.0,
          delta: 1.0,
          sigma: 3.78,
        };

        Cesium.knockout.track(viewModel);
        const toolbar = document.getElementById("toolbar");
        Cesium.knockout.applyBindings(viewModel, toolbar);
        for (const name in viewModel) {
          if (viewModel.hasOwnProperty(name)) {
            Cesium.knockout
              .getObservable(viewModel, name)
              .subscribe(updatePostProcess);
          }
        }

        function updatePostProcess() {
          dof.enabled = Boolean(viewModel.show);
          dof.uniforms.focalDistance = Number(viewModel.focalDistance);
          dof.uniforms.delta = Number(viewModel.delta);
          dof.uniforms.sigma = Number(viewModel.sigma);
        }
        updatePostProcess();

        // Aim the camera at the first balloon with a small offset so
        // foreground / mid / background separation is visible — the
        // focal-distance slider then sweeps the focus plane through
        // the row, with near and far balloons getting blurred.
        const target = Cesium.Cartesian3.fromDegrees(
          initialLon + lonIncrement,
          lat,
          height + 7.5,
        );
        const offset = new Cesium.Cartesian3(
          -37.048378684557974,
          -24.852967044804245,
          4.352023653686047,
        );
        viewer.scene.camera.lookAt(target, offset);
        //Sandcastle_End
      };
      if (typeof Cesium !== "undefined") {
        window.startupCalled = true;
        window.startup(Cesium).catch((error) => {
          "use strict";
          console.error(error);
        });
        Sandcastle.finishedLoading();
      }
    </script>
  </body>
</html>
