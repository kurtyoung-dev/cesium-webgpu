<!doctype html>
<html lang="en">
  <head>
    <!-- Use correct character set. -->
    <meta charset="utf-8" />
    <!-- Tell IE to use the latest, best version. -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Make the application on mobile take up the full browser screen and disable user scaling. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>Cesium Viewer</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="CesiumViewer.css" media="screen" />
    <style>
      .renderer-toolbar {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        padding: 4px 10px;
        backdrop-filter: blur(8px);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        color: #fff;
        user-select: none;
      }
      .renderer-toolbar .btn-group {
        display: flex;
        gap: 1px;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      .renderer-toolbar button {
        border: none;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.08);
        color: #ccc;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .renderer-toolbar button:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }
      .renderer-toolbar button.active {
        background: #4fc3f7;
        color: #000;
      }
      .renderer-toolbar label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        margin-left: 4px;
      }
      .renderer-toolbar input[type="checkbox"] {
        cursor: pointer;
        accent-color: #4fc3f7;
      }
      .renderer-toolbar .divider {
        width: 1px;
        height: 16px;
        background: rgba(255, 255, 255, 0.25);
        margin: 0 2px;
      }
      .split-container {
        display: flex;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
      .split-pane {
        flex: 1;
        position: relative;
        min-width: 0;
      }
      .split-divider {
        width: 2px;
        background: #4fc3f7;
        flex-shrink: 0;
      }
      .split-label {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        padding: 2px 10px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body style="background: #000">
    <div id="rendererToolbar" class="renderer-toolbar">
      <div class="btn-group">
        <button id="btnWebGL" class="active" onclick="switchRenderer('webgl')">
          WebGL
        </button>
        <button id="btnWebGPU" onclick="switchRenderer('webgpu')">
          WebGPU
        </button>
        <button id="btnSplit" onclick="switchRenderer('split')">Split</button>
      </div>
      <div class="divider"></div>
      <label>
        <input
          type="checkbox"
          id="fpsToggle"
          onchange="toggleFps(this.checked)"
        />
        FPS
      </label>
    </div>
    <div id="cesiumContainer" class="fullWindow"></div>
    <div id="loadingIndicator" class="loadingIndicator"></div>
    <script src="CesiumViewer.js" type="module"></script>
  </body>
</html>
