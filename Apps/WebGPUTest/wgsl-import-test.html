<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WGSL Import System Test</title>
    <style>
      body {
        margin: 0;
        font-family: monospace;
        background: #111;
        color: #eee;
      }
      #log {
        padding: 20px;
        white-space: pre-wrap;
        font-size: 13px;
        max-height: 90vh;
        overflow-y: auto;
      }
      .pass {
        color: #5fd35f;
      }
      .fail {
        color: #ff6b6b;
      }
      .info {
        color: #67b7ff;
      }
      .warn {
        color: #ffd700;
      }
      h1 {
        color: #67b7ff;
        font-size: 20px;
      }
      canvas {
        width: 400px;
        height: 300px;
        border: 1px solid #333;
        display: block;
        margin: 10px 20px;
      }
    </style>
  </head>
  <body>
    <div id="log"><h1>WGSL Import System Test Suite</h1></div>
    <canvas id="canvas" width="400" height="300"></canvas>
    <script type="module">
      // ============================================================
      // FORK-16: This page used to ship its own ~280-line copy of
      // WGSLShaderPreprocessor + WGSLShaderLibrary for "standalone
      // testing." That made the page useless as a regression test —
      // it could only ever validate its own copy of the preprocessor,
      // not the one the WebGPU pipeline actually uses. We now import
      // the production module + the production library, so a divergence
      // between this test and the runtime causes an immediate failure
      // here, and any chunk added to WGSLBuiltins.ts is automatically
      // available in this test page.
      // ============================================================
      import {
        WGSLShaderPreprocessor,
        WGSLShaderLibrary,
        createDefaultWGSLLibrary,
      } from "../../Build/CesiumUnminified/index.js";

      const logEl = document.getElementById("log");
      function log(msg, cls = "") {
        logEl.innerHTML += `<span class="${cls}">${msg}</span>\n`;
      }
      function pass(msg) {
        log("PASS: " + msg, "pass");
      }
      function fail(msg) {
        log("FAIL: " + msg, "fail");
      }
      function info(msg) {
        log(msg, "info");
      }
      function warn(msg) {
        log(msg, "warn");
      }

      // Sanity check: prove the imports actually resolved.
      if (
        !WGSLShaderPreprocessor ||
        !WGSLShaderLibrary ||
        !createDefaultWGSLLibrary
      ) {
        fail(
          "WGSLShaderPreprocessor / WGSLShaderLibrary / createDefaultWGSLLibrary " +
            "not exported from Cesium namespace — rebuild engine after FORK-16",
        );
      }

      // ============================================================
      // TESTS — exercise the SAME preprocessor + library that the
      // WebGPU pipeline uses at runtime. The production library
      // (createDefaultWGSLLibrary) carries more chunks than the old
      // hand-rolled one, so the size assertion bumps to >= 13.
      // ============================================================
      async function runTests() {
        info("=== Test 1: Library Registration ===");
        const lib = createDefaultWGSLLibrary();
        if (lib.size >= 13)
          pass("Library has " + lib.size + " chunks registered");
        else
          fail(
            "Library only has " +
              lib.size +
              " chunks (expected >= 13 from production WGSLBuiltins.ts)",
          );

        info("\n=== Test 2: Identifier Indexing ===");
        const ids = lib.getIndexedIdentifiers();
        info("Indexed identifiers: " + ids.join(", "));
        if (ids.includes("csm_phongSimple")) pass("csm_phongSimple indexed");
        else fail("csm_phongSimple not indexed");
        if (ids.includes("csm_distributionGGX"))
          pass("csm_distributionGGX indexed");
        else fail("csm_distributionGGX not indexed");
        if (ids.includes("CameraUniforms"))
          pass("CameraUniforms struct indexed");
        else fail("CameraUniforms struct not indexed");

        info("\n=== Test 3: Parse Imports ===");
        const src1 = `// #import "structs/CameraUniforms"\n// #import "functions/csm_phong"\n@vertex fn main() {}`;
        const imports = WGSLShaderPreprocessor.parseImports(src1);
        if (imports.length === 2)
          pass("Parsed 2 imports: " + imports.join(", "));
        else fail("Expected 2 imports, got " + imports.length);

        info("\n=== Test 4: Explicit Import Resolution ===");
        const pp = new WGSLShaderPreprocessor(lib);
        const result4 = pp.process(src1);
        if (result4.includedChunks.includes("structs/CameraUniforms"))
          pass("CameraUniforms chunk included");
        else fail("CameraUniforms chunk NOT included");
        if (result4.includedChunks.includes("functions/csm_phong"))
          pass("csm_phong chunk included");
        else fail("csm_phong chunk NOT included");
        if (result4.code.includes("struct CameraUniforms"))
          pass("CameraUniforms struct in output");
        else fail("CameraUniforms struct NOT in output");
        if (result4.code.includes("fn csm_phongSimple"))
          pass("csm_phongSimple fn in output");
        else fail("csm_phongSimple fn NOT in output");

        info("\n=== Test 5: Auto-Resolution (csm_ prefix) ===");
        const src5 = `
@fragment fn fragmentMain() -> @location(0) vec4<f32> {
    let color = csm_reinhardTonemap(vec3<f32>(1.0, 0.5, 0.2));
    return vec4<f32>(csm_linearToSrgb(color), 1.0);
}`;
        const result5 = pp.process(src5);
        if (result5.includedChunks.includes("functions/csm_tonemapping"))
          pass("Auto-resolved csm_tonemapping");
        else fail("Did NOT auto-resolve csm_tonemapping");
        if (result5.includedChunks.includes("functions/csm_gammaCorrection"))
          pass("Auto-resolved csm_gammaCorrection");
        else fail("Did NOT auto-resolve csm_gammaCorrection");
        info("Included chunks: " + result5.includedChunks.join(", "));

        info("\n=== Test 6: Transitive Dependencies ===");
        const src6 = `// #import "functions/csm_distributionGGX"\n@fragment fn main() -> @location(0) vec4<f32> { return vec4(1.0); }`;
        const result6 = pp.process(src6);
        info("Dependency order: " + result6.dependencyOrder.join(" -> "));
        if (result6.includedChunks.includes("functions/csm_constants"))
          pass("Transitive dep csm_constants auto-resolved");
        else fail("Transitive dep csm_constants NOT resolved");
        if (result6.code.includes("CSM_PI")) pass("CSM_PI constant in output");
        else fail("CSM_PI NOT in output");

        info("\n=== Test 7: Conditional Compilation (#ifdef) ===");
        const src7 = `
// #ifdef USE_PHONG
fn getLighting() -> vec3<f32> { return vec3<f32>(1.0, 0.0, 0.0); }
// #else
fn getLighting() -> vec3<f32> { return vec3<f32>(0.0, 1.0, 0.0); }
// #endif
`;
        const r7a = pp.process(src7, { defines: ["USE_PHONG"] });
        if (
          r7a.code.includes("1.0, 0.0, 0.0") &&
          !r7a.code.includes("0.0, 1.0, 0.0")
        )
          pass("#ifdef USE_PHONG: Phong branch selected");
        else fail("#ifdef USE_PHONG: wrong branch");

        const r7b = pp.process(src7, { defines: [] });
        if (
          r7b.code.includes("0.0, 1.0, 0.0") &&
          !r7b.code.includes("1.0, 0.0, 0.0")
        )
          pass("#ifdef not defined: else branch selected");
        else fail("#ifdef not defined: wrong branch");

        info("\n=== Test 8: Deduplication ===");
        const src8 = `
// #import "functions/csm_constants"
// #import "functions/csm_distributionGGX"
@fragment fn main() -> @location(0) vec4<f32> { return vec4(1.0); }`;
        const result8 = pp.process(src8);
        const piCount = (result8.code.match(/const CSM_PI/g) || []).length;
        if (piCount === 1) pass("CSM_PI appears exactly once (deduplicated)");
        else fail("CSM_PI appears " + piCount + " times (should be 1)");

        info("\n=== Test 9: Compile with WebGPU ===");
        if (!navigator.gpu) {
          warn("WebGPU not available - skipping compile test");
        } else {
          try {
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) throw new Error("No adapter");
            const device = await adapter.requestDevice();

            // Shader that uses imported Phong lighting
            const phongShader = `
// #import "structs/LightUniforms"
// #import "functions/csm_phong"

struct VertexOutput {
    @builtin(position) position: vec4<f32>,
    @location(0) worldPos: vec3<f32>,
    @location(1) normal: vec3<f32>,
}

struct Uniforms { mvp: mat4x4<f32>, }
@group(0) @binding(0) var<uniform> u: Uniforms;

@vertex fn vertexMain(@location(0) pos: vec3<f32>, @location(1) norm: vec3<f32>) -> VertexOutput {
    var out: VertexOutput;
    out.position = u.mvp * vec4<f32>(pos, 1.0);
    out.worldPos = pos;
    out.normal = norm;
    return out;
}

@fragment fn fragmentMain(input: VertexOutput) -> @location(0) vec4<f32> {
    let N = normalize(input.normal);
    let V = normalize(vec3<f32>(0.0, 1.0, 3.0) - input.worldPos);
    let L = normalize(vec3<f32>(0.5, 1.0, 0.5));
    let color = csm_phongSimple(N, V, L, vec3<f32>(0.6, 0.8, 1.0), 32.0);
    return vec4<f32>(color, 1.0);
}`;
            const resolved = pp.process(phongShader, {
              label: "PhongImportTest",
            });
            info("Resolved code length: " + resolved.code.length + " chars");
            info("Included: " + resolved.includedChunks.join(", "));

            const module = device.createShaderModule({
              code: resolved.code,
              label: "PhongImportTest",
            });
            const compInfo = await module.getCompilationInfo();
            const errors = compInfo.messages.filter((m) => m.type === "error");
            if (errors.length === 0)
              pass("WebGPU shader compiled successfully with imports!");
            else {
              fail("Shader compilation errors:");
              errors.forEach((e) => fail("  L" + e.lineNum + ": " + e.message));
            }

            // Test auto-resolved PBR functions
            const pbrShader = `
struct VertexOutput { @builtin(position) position: vec4<f32>, }
@vertex fn vertexMain(@location(0) pos: vec3<f32>) -> VertexOutput {
    var out: VertexOutput;
    out.position = vec4<f32>(pos, 1.0);
    return out;
}
@fragment fn fragmentMain() -> @location(0) vec4<f32> {
    let N = vec3<f32>(0.0, 1.0, 0.0);
    let V = vec3<f32>(0.0, 0.0, 1.0);
    let L = vec3<f32>(0.5, 1.0, 0.5);
    let H = normalize(V + L);
    let D = csm_distributionGGX(N, H, 0.5);
    let G = csm_geometrySmith(N, V, L, 0.5);
    let F = csm_fresnelSchlick(max(dot(H, V), 0.0), vec3<f32>(0.04));
    let toneMapped = csm_reinhardTonemap(vec3<f32>(D) + F * G);
    let final_color = csm_linearToSrgb(toneMapped);
    return vec4<f32>(final_color, 1.0);
}`;
            const pbrResult = pp.process(pbrShader, {
              label: "PBRAutoResolve",
            });
            info(
              "\nPBR auto-resolved chunks: " +
                pbrResult.includedChunks.join(", "),
            );
            info("Dependency order: " + pbrResult.dependencyOrder.join(" -> "));

            const pbrModule = device.createShaderModule({
              code: pbrResult.code,
              label: "PBRAutoResolve",
            });
            const pbrInfo = await pbrModule.getCompilationInfo();
            const pbrErrors = pbrInfo.messages.filter(
              (m) => m.type === "error",
            );
            if (pbrErrors.length === 0)
              pass("PBR auto-resolved shader compiled successfully!");
            else {
              fail("PBR compilation errors:");
              pbrErrors.forEach((e) =>
                fail("  L" + e.lineNum + ": " + e.message),
              );
            }

            device.destroy();
          } catch (err) {
            fail("WebGPU test error: " + err.message);
            console.error(err);
          }
        }

        info("\n=== Test 10: Strip Comments ===");
        const src10 = `// This is a comment\n/* Block comment */\nfn main() {}`;
        const r10 = WGSLShaderPreprocessor.removeComments(src10);
        if (
          !r10.includes("This is a comment") &&
          !r10.includes("Block comment")
        )
          pass("Comments stripped successfully");
        else fail("Comments NOT fully stripped");

        info("\n=== All Tests Complete ===");
      }

      runTests().catch((err) => fail("Test suite error: " + err.message));
    </script>
  </body>
</html>
