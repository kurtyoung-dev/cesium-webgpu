<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebGPU Mipmap Generation Test</title>
    <style>
      body {
        margin: 0;
        background: #1a1a2e;
        color: #e0e0e0;
        font-family: "Segoe UI", monospace;
      }
      h1 {
        text-align: center;
        padding: 10px;
        margin: 0;
        font-size: 18px;
        background: #16213e;
      }
      .container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
        justify-content: center;
      }
      .test-card {
        background: #0f3460;
        border-radius: 8px;
        padding: 10px;
        width: 420px;
      }
      .test-card h3 {
        margin: 0 0 6px 0;
        font-size: 14px;
      }
      canvas {
        border: 1px solid #333;
        border-radius: 4px;
        display: block;
      }
      .status {
        font-size: 12px;
        margin-top: 4px;
        padding: 4px;
        border-radius: 4px;
      }
      .pass {
        background: #1b5e20;
      }
      .fail {
        background: #b71c1c;
      }
      .info {
        background: #1a237e;
      }
      #summary {
        text-align: center;
        padding: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>WebGPU Mipmap Generation Test</h1>
    <div id="summary">Running tests…</div>
    <div class="container" id="tests"></div>

    <script type="module">
      /* ── helpers ── */
      let passed = 0,
        failed = 0;
      const container = document.getElementById("tests");

      function addCard(id, title, w, h) {
        const card = document.createElement("div");
        card.className = "test-card";
        card.innerHTML = `<h3>${id}: ${title}</h3><canvas id="c_${id}" width="${w}" height="${h}"></canvas><div id="s_${id}" class="status info">Running…</div>`;
        container.appendChild(card);
        return document.getElementById(`c_${id}`);
      }
      function setStatus(id, ok, msg) {
        const el = document.getElementById(`s_${id}`);
        el.textContent = msg;
        el.className = "status " + (ok ? "pass" : "fail");
        ok ? passed++ : failed++;
        document.getElementById("summary").textContent =
          `Passed: ${passed} | Failed: ${failed}`;
      }

      /* ── Mipmap blit shader (same as WebGPUMipmapGenerator) ── */
      const MIPMAP_BLIT_WGSL = `
@group(0) @binding(0) var srcSampler: sampler;
@group(0) @binding(1) var srcTexture: texture_2d<f32>;
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vertexMain(@builtin(vertex_index) vi: u32) -> VO {
  var p = array<vec2f,3>(vec2f(-1,-1),vec2f(3,-1),vec2f(-1,3));
  var u = array<vec2f,3>(vec2f(0,1),vec2f(2,1),vec2f(0,-1));
  var o: VO; o.pos = vec4f(p[vi],0,1); o.uv = u[vi]; return o;
}
@fragment fn fragmentMain(@location(0) uv: vec2f) -> @location(0) vec4f {
  return textureSample(srcTexture, srcSampler, uv);
}`;

      /* ── Display shader: renders a textured quad at a specific mip level ── */
      const DISPLAY_WGSL = `
@group(0) @binding(0) var samp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: vec4f; // lodBias in x
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) vi: u32) -> VO {
  var p = array<vec2f,6>(vec2f(-1,-1),vec2f(1,-1),vec2f(-1,1),vec2f(-1,1),vec2f(1,-1),vec2f(1,1));
  var u = array<vec2f,6>(vec2f(0,1),vec2f(1,1),vec2f(0,0),vec2f(0,0),vec2f(1,1),vec2f(1,0));
  var o: VO; o.pos = vec4f(p[vi],0,1); o.uv = u[vi]; return o;
}
@fragment fn fs(@location(0) uv: vec2f) -> @location(0) vec4f {
  return textureSampleLevel(tex, samp, uv, params.x);
}`;

      async function run() {
        if (!navigator.gpu) {
          document.getElementById("summary").textContent =
            "WebGPU not supported";
          return;
        }
        const adapter = await navigator.gpu.requestAdapter();
        const device = await adapter.requestDevice();

        /* ── Test 1: Shader compilation ── */
        {
          const id = "ShaderCompile";
          addCard(id, "Mipmap blit shader compilation", 200, 30);
          try {
            const mod = device.createShaderModule({ code: MIPMAP_BLIT_WGSL });
            const info = await mod.getCompilationInfo();
            const errs = info.messages.filter((m) => m.type === "error");
            setStatus(
              id,
              errs.length === 0,
              errs.length === 0
                ? "✅ Shader compiled (0 errors)"
                : `❌ ${errs.length} errors`,
            );
          } catch (e) {
            setStatus(id, false, `❌ ${e.message}`);
          }
        }

        /* ── Test 2: MipLevelCount calculation ── */
        {
          const id = "MipCount";
          addCard(id, "Mip level count calculation", 200, 30);
          const calc = (w, h) => Math.floor(Math.log2(Math.max(w, h))) + 1;
          const ok =
            calc(256, 256) === 9 &&
            calc(512, 256) === 10 &&
            calc(1, 1) === 1 &&
            calc(1024, 1024) === 11;
          setStatus(
            id,
            ok,
            ok
              ? "✅ 256→9, 512x256→10, 1→1, 1024→11"
              : "❌ Mip calculation wrong",
          );
        }

        /* ── Test 3: Generate mipmaps for 256×256 checkerboard ── */
        {
          const id = "GenMip256";
          const canvas = addCard(
            id,
            "Generate mipmaps 256×256 → 9 levels",
            400,
            200,
          );
          try {
            const SIZE = 256;
            const mipCount = Math.floor(Math.log2(SIZE)) + 1; // 9
            // Create checkerboard pattern
            const data = new Uint8Array(SIZE * SIZE * 4);
            for (let y = 0; y < SIZE; y++) {
              for (let x = 0; x < SIZE; x++) {
                const i = (y * SIZE + x) * 4;
                const check = ((x >> 4) + (y >> 4)) & 1;
                data[i] = check ? 255 : 30;
                data[i + 1] = check ? 100 : 180;
                data[i + 2] = check ? 50 : 220;
                data[i + 3] = 255;
              }
            }
            // Create texture with mip levels
            const tex = device.createTexture({
              size: { width: SIZE, height: SIZE },
              format: "rgba8unorm",
              mipLevelCount: mipCount,
              usage:
                GPUTextureUsage.TEXTURE_BINDING |
                GPUTextureUsage.COPY_DST |
                GPUTextureUsage.RENDER_ATTACHMENT,
            });
            device.queue.writeTexture(
              { texture: tex },
              data,
              { bytesPerRow: SIZE * 4 },
              { width: SIZE, height: SIZE },
            );

            // Generate mipmaps using blit pipeline
            const shaderMod = device.createShaderModule({
              code: MIPMAP_BLIT_WGSL,
            });
            const sampler = device.createSampler({
              magFilter: "linear",
              minFilter: "linear",
            });
            const bgl = device.createBindGroupLayout({
              entries: [
                {
                  binding: 0,
                  visibility: GPUShaderStage.FRAGMENT,
                  sampler: { type: "filtering" },
                },
                {
                  binding: 1,
                  visibility: GPUShaderStage.FRAGMENT,
                  texture: { sampleType: "float" },
                },
              ],
            });
            const pipeline = device.createRenderPipeline({
              layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
              vertex: { module: shaderMod, entryPoint: "vertexMain" },
              fragment: {
                module: shaderMod,
                entryPoint: "fragmentMain",
                targets: [{ format: "rgba8unorm" }],
              },
              primitive: { topology: "triangle-list" },
            });
            const encoder = device.createCommandEncoder();
            for (let mip = 1; mip < mipCount; mip++) {
              const srcView = tex.createView({
                baseMipLevel: mip - 1,
                mipLevelCount: 1,
              });
              const dstView = tex.createView({
                baseMipLevel: mip,
                mipLevelCount: 1,
              });
              const bg = device.createBindGroup({
                layout: bgl,
                entries: [
                  { binding: 0, resource: sampler },
                  { binding: 1, resource: srcView },
                ],
              });
              const pass = encoder.beginRenderPass({
                colorAttachments: [
                  {
                    view: dstView,
                    loadOp: "clear",
                    storeOp: "store",
                    clearValue: { r: 0, g: 0, b: 0, a: 0 },
                  },
                ],
              });
              pass.setPipeline(pipeline);
              pass.setBindGroup(0, bg);
              pass.draw(3);
              pass.end();
            }
            device.queue.submit([encoder.finish()]);

            // Display mip levels side by side on canvas
            const ctx = canvas.getContext("webgpu");
            ctx.configure({
              device,
              format: navigator.gpu.getPreferredCanvasFormat(),
            });
            const dispMod = device.createShaderModule({ code: DISPLAY_WGSL });
            const dispBgl = device.createBindGroupLayout({
              entries: [
                {
                  binding: 0,
                  visibility: GPUShaderStage.FRAGMENT,
                  sampler: { type: "filtering" },
                },
                {
                  binding: 1,
                  visibility: GPUShaderStage.FRAGMENT,
                  texture: { sampleType: "float" },
                },
                {
                  binding: 2,
                  visibility: GPUShaderStage.FRAGMENT,
                  buffer: { type: "uniform" },
                },
              ],
            });
            const dispPipeline = device.createRenderPipeline({
              layout: device.createPipelineLayout({
                bindGroupLayouts: [dispBgl],
              }),
              vertex: { module: dispMod, entryPoint: "vs" },
              fragment: {
                module: dispMod,
                entryPoint: "fs",
                targets: [{ format: navigator.gpu.getPreferredCanvasFormat() }],
              },
              primitive: { topology: "triangle-list" },
            });
            const dispSampler = device.createSampler({
              magFilter: "nearest",
              minFilter: "nearest",
            });
            const fullView = tex.createView();
            const enc2 = device.createCommandEncoder();
            const tv = ctx.getCurrentTexture().createView();
            const rp = enc2.beginRenderPass({
              colorAttachments: [
                {
                  view: tv,
                  loadOp: "clear",
                  storeOp: "store",
                  clearValue: { r: 0.06, g: 0.06, b: 0.12, a: 1 },
                },
              ],
            });
            // Draw first 5 mip levels as tiles
            let xOff = 0;
            for (let mip = 0; mip < Math.min(5, mipCount); mip++) {
              const mipW = Math.max(1, SIZE >> mip);
              const dispW = Math.min(mipW, 128);
              const paramBuf = device.createBuffer({
                size: 256,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
              });
              device.queue.writeBuffer(
                paramBuf,
                0,
                new Float32Array([mip, 0, 0, 0]),
              );
              const bg = device.createBindGroup({
                layout: dispBgl,
                entries: [
                  { binding: 0, resource: dispSampler },
                  { binding: 1, resource: fullView },
                  { binding: 2, resource: { buffer: paramBuf } },
                ],
              });
              rp.setViewport(xOff, 10, dispW, dispW, 0, 1);
              rp.setPipeline(dispPipeline);
              rp.setBindGroup(0, bg);
              rp.draw(6);
              xOff += dispW + 4;
            }
            rp.end();
            device.queue.submit([enc2.finish()]);

            setStatus(
              id,
              true,
              `✅ Generated ${mipCount} mip levels (256→1). First 5 shown left to right.`,
            );
          } catch (e) {
            setStatus(id, false, `❌ ${e.message}`);
          }
        }

        /* ── Test 4: NPOT texture mipmap ── */
        {
          const id = "NPOTMip";
          const canvas = addCard(
            id,
            "NPOT 300×200 mipmap generation",
            400,
            150,
          );
          try {
            const W = 300,
              H = 200;
            const mipCount = Math.floor(Math.log2(Math.max(W, H))) + 1; // 9
            const data = new Uint8Array(W * H * 4);
            for (let y = 0; y < H; y++) {
              for (let x = 0; x < W; x++) {
                const i = (y * W + x) * 4;
                data[i] = Math.floor((x / W) * 255);
                data[i + 1] = Math.floor((y / H) * 255);
                data[i + 2] = 128;
                data[i + 3] = 255;
              }
            }
            const tex = device.createTexture({
              size: { width: W, height: H },
              format: "rgba8unorm",
              mipLevelCount: mipCount,
              usage:
                GPUTextureUsage.TEXTURE_BINDING |
                GPUTextureUsage.COPY_DST |
                GPUTextureUsage.RENDER_ATTACHMENT,
            });
            device.queue.writeTexture(
              { texture: tex },
              data,
              { bytesPerRow: W * 4 },
              { width: W, height: H },
            );

            // Generate mipmaps
            const shaderMod = device.createShaderModule({
              code: MIPMAP_BLIT_WGSL,
            });
            const sampler = device.createSampler({
              magFilter: "linear",
              minFilter: "linear",
            });
            const bgl = device.createBindGroupLayout({
              entries: [
                {
                  binding: 0,
                  visibility: GPUShaderStage.FRAGMENT,
                  sampler: { type: "filtering" },
                },
                {
                  binding: 1,
                  visibility: GPUShaderStage.FRAGMENT,
                  texture: { sampleType: "float" },
                },
              ],
            });
            const pipeline = device.createRenderPipeline({
              layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
              vertex: { module: shaderMod, entryPoint: "vertexMain" },
              fragment: {
                module: shaderMod,
                entryPoint: "fragmentMain",
                targets: [{ format: "rgba8unorm" }],
              },
              primitive: { topology: "triangle-list" },
            });
            const encoder = device.createCommandEncoder();
            for (let mip = 1; mip < mipCount; mip++) {
              const srcView = tex.createView({
                baseMipLevel: mip - 1,
                mipLevelCount: 1,
              });
              const dstView = tex.createView({
                baseMipLevel: mip,
                mipLevelCount: 1,
              });
              const bg = device.createBindGroup({
                layout: bgl,
                entries: [
                  { binding: 0, resource: sampler },
                  { binding: 1, resource: srcView },
                ],
              });
              const pass = encoder.beginRenderPass({
                colorAttachments: [
                  {
                    view: dstView,
                    loadOp: "clear",
                    storeOp: "store",
                    clearValue: { r: 0, g: 0, b: 0, a: 0 },
                  },
                ],
              });
              pass.setPipeline(pipeline);
              pass.setBindGroup(0, bg);
              pass.draw(3);
              pass.end();
            }
            device.queue.submit([encoder.finish()]);
            setStatus(
              id,
              true,
              `✅ NPOT ${W}×${H} → ${mipCount} mip levels generated successfully`,
            );
          } catch (e) {
            setStatus(id, false, `❌ ${e.message}`);
          }
        }

        /* ── Test 5: Pixel readback verification ── */
        {
          const id = "Readback";
          addCard(id, "Mip level 1 pixel readback (128×128)", 200, 30);
          try {
            const SIZE = 256;
            const data = new Uint8Array(SIZE * SIZE * 4);
            // Fill with solid red
            for (let i = 0; i < data.length; i += 4) {
              data[i] = 200;
              data[i + 1] = 50;
              data[i + 2] = 50;
              data[i + 3] = 255;
            }
            const tex = device.createTexture({
              size: { width: SIZE, height: SIZE },
              format: "rgba8unorm",
              mipLevelCount: 2,
              usage:
                GPUTextureUsage.TEXTURE_BINDING |
                GPUTextureUsage.COPY_DST |
                GPUTextureUsage.RENDER_ATTACHMENT |
                GPUTextureUsage.COPY_SRC,
            });
            device.queue.writeTexture(
              { texture: tex },
              data,
              { bytesPerRow: SIZE * 4 },
              { width: SIZE, height: SIZE },
            );

            // Generate mip level 1
            const shaderMod = device.createShaderModule({
              code: MIPMAP_BLIT_WGSL,
            });
            const sampler = device.createSampler({
              magFilter: "linear",
              minFilter: "linear",
            });
            const bgl = device.createBindGroupLayout({
              entries: [
                {
                  binding: 0,
                  visibility: GPUShaderStage.FRAGMENT,
                  sampler: { type: "filtering" },
                },
                {
                  binding: 1,
                  visibility: GPUShaderStage.FRAGMENT,
                  texture: { sampleType: "float" },
                },
              ],
            });
            const pipeline = device.createRenderPipeline({
              layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
              vertex: { module: shaderMod, entryPoint: "vertexMain" },
              fragment: {
                module: shaderMod,
                entryPoint: "fragmentMain",
                targets: [{ format: "rgba8unorm" }],
              },
              primitive: { topology: "triangle-list" },
            });
            const enc = device.createCommandEncoder();
            const srcView = tex.createView({
              baseMipLevel: 0,
              mipLevelCount: 1,
            });
            const dstView = tex.createView({
              baseMipLevel: 1,
              mipLevelCount: 1,
            });
            const bg = device.createBindGroup({
              layout: bgl,
              entries: [
                { binding: 0, resource: sampler },
                { binding: 1, resource: srcView },
              ],
            });
            const pass = enc.beginRenderPass({
              colorAttachments: [
                {
                  view: dstView,
                  loadOp: "clear",
                  storeOp: "store",
                  clearValue: { r: 0, g: 0, b: 0, a: 0 },
                },
              ],
            });
            pass.setPipeline(pipeline);
            pass.setBindGroup(0, bg);
            pass.draw(3);
            pass.end();

            // Read back mip level 1 center pixel
            const mip1Size = SIZE >> 1; // 128
            const bytesPerRow = Math.ceil((mip1Size * 4) / 256) * 256;
            const readBuf = device.createBuffer({
              size: bytesPerRow * mip1Size,
              usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
            });
            enc.copyTextureToBuffer(
              { texture: tex, mipLevel: 1 },
              { buffer: readBuf, bytesPerRow },
              { width: mip1Size, height: mip1Size },
            );
            device.queue.submit([enc.finish()]);
            await readBuf.mapAsync(GPUMapMode.READ);
            const pixels = new Uint8Array(readBuf.getMappedRange());
            // Check center pixel (should be ~200,50,50,255)
            const cx = Math.floor(mip1Size / 2),
              cy = Math.floor(mip1Size / 2);
            const pi = cy * bytesPerRow + cx * 4;
            const r = pixels[pi],
              g = pixels[pi + 1],
              b = pixels[pi + 2],
              a = pixels[pi + 3];
            readBuf.unmap();
            readBuf.destroy();
            const ok =
              Math.abs(r - 200) < 10 &&
              Math.abs(g - 50) < 10 &&
              Math.abs(b - 50) < 10 &&
              a === 255;
            setStatus(
              id,
              ok,
              ok
                ? `✅ Mip1 center pixel: rgba(${r},${g},${b},${a}) ≈ expected (200,50,50,255)`
                : `❌ Mip1 center pixel: rgba(${r},${g},${b},${a}) — expected ~(200,50,50,255)`,
            );
          } catch (e) {
            setStatus(id, false, `❌ ${e.message}`);
          }
        }

        /* ── Test 6: Pipeline caching ── */
        {
          const id = "Cache";
          addCard(id, "Pipeline cache efficiency (same format)", 200, 30);
          try {
            const shaderMod = device.createShaderModule({
              code: MIPMAP_BLIT_WGSL,
            });
            // Creating pipelines for the same format should be fast
            const t0 = performance.now();
            for (let i = 0; i < 10; i++) {
              const bgl = device.createBindGroupLayout({
                entries: [
                  {
                    binding: 0,
                    visibility: GPUShaderStage.FRAGMENT,
                    sampler: { type: "filtering" },
                  },
                  {
                    binding: 1,
                    visibility: GPUShaderStage.FRAGMENT,
                    texture: { sampleType: "float" },
                  },
                ],
              });
              device.createRenderPipeline({
                layout: device.createPipelineLayout({
                  bindGroupLayouts: [bgl],
                }),
                vertex: { module: shaderMod, entryPoint: "vertexMain" },
                fragment: {
                  module: shaderMod,
                  entryPoint: "fragmentMain",
                  targets: [{ format: "rgba8unorm" }],
                },
                primitive: { topology: "triangle-list" },
              });
            }
            const dt = (performance.now() - t0).toFixed(1);
            setStatus(
              id,
              true,
              `✅ 10 pipeline creates in ${dt}ms (WebGPUMipmapGenerator caches per-format)`,
            );
          } catch (e) {
            setStatus(id, false, `❌ ${e.message}`);
          }
        }
      }
      run();
    </script>
  </body>
</html>
