<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Renderer Phases - Comprehensive Test</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e1b4b);
        color: #fff;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        font-size: 2.4em;
        margin-bottom: 5px;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        text-align: center;
        font-size: 1.2em;
        margin-bottom: 25px;
        opacity: 0.8;
        color: #60a5fa;
      }
      .phase {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .phase h2 {
        margin: 0 0 10px;
        font-size: 1.1em;
        color: #fbbf24;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .phase h2 .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 0.75em;
      }
      .badge-pass {
        background: #16a34a;
        color: #fff;
      }
      .badge-fail {
        background: #dc2626;
        color: #fff;
      }
      .badge-skip {
        background: #a16207;
        color: #fff;
      }
      .badge-run {
        background: #2563eb;
        color: #fff;
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      .detail {
        font-family: monospace;
        font-size: 0.85em;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 6px;
        margin-top: 6px;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 200px;
        overflow-y: auto;
      }
      .canvas-row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .canvas-row canvas {
        border-radius: 8px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        background: #000;
      }
      .summary {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 20px;
        margin-top: 16px;
        text-align: center;
        font-size: 1.3em;
      }
      .summary .big {
        font-size: 2em;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>WebGPU Renderer Phases Test</h1>
      <div class="subtitle">
        Comprehensive diagnostic for every stage of the CesiumJS WebGPU pipeline
      </div>

      <div id="phases"></div>

      <div class="canvas-row">
        <div>
          <h3 style="margin: 6px 0">Phase 7 &mdash; Direct WebGPU Draw</h3>
          <canvas id="directCanvas" width="400" height="300"></canvas>
        </div>
        <div>
          <h3 style="margin: 6px 0">Phase 10 &mdash; Cesium Scene Render</h3>
          <canvas id="sceneCanvas" width="400" height="300"></canvas>
        </div>
      </div>

      <div class="summary" id="summary"></div>
    </div>

    <!-- CORS Protection: Detect file:// protocol BEFORE the module script loads -->
    <script>
      if (window.location.protocol === "file:") {
        window.__fileProtocolDetected = true;
        document.addEventListener("DOMContentLoaded", function () {
          var phases = document.getElementById("phases");
          if (phases) {
            phases.innerHTML =
              '<div class="phase" style="border-color:#dc2626;">' +
              '<h2 style="color:#f87171;">⚠️ CORS Error: Cannot load ES modules from file:// protocol</h2>' +
              '<div class="detail" style="color:#fbbf24;">' +
              "Chrome and Edge block ES module imports when opened directly from the filesystem.\n\n" +
              "To run this test, use the CesiumJS development server:\n\n" +
              "  1. Open a terminal in the project root\n" +
              "  2. Run: node server.js\n" +
              "  3. Navigate to: http://localhost:8080/Apps/WebGPUTest/webgpu-renderer-phases-test.html\n\n" +
              "Alternatively, use Firefox which allows file:// ES module imports." +
              "</div></div>";
          }
          var summary = document.getElementById("summary");
          if (summary) {
            summary.innerHTML =
              '<div style="color:#f87171">Cannot run: file:// protocol not supported for ES modules in this browser. Use <code>node server.js</code> and open via http://localhost:8080</div>';
          }
        });
      }
    </script>

    <script type="module">
      import * as Cesium from "../../Build/CesiumUnminified/index.js";

      // ======================================================================
      // Test framework
      // ======================================================================
      const results = [];
      const phasesDiv = document.getElementById("phases");

      function phaseEl(id, title) {
        const div = document.createElement("div");
        div.className = "phase";
        div.id = `phase-${id}`;
        div.innerHTML = `<h2><span class="badge badge-run" id="badge-${id}">RUNNING</span> Phase ${id}: ${title}</h2><div class="detail" id="detail-${id}"></div>`;
        phasesDiv.appendChild(div);
        return {
          log(msg) {
            document.getElementById(`detail-${id}`).textContent += msg + "\n";
            console.log(`[Phase ${id}] ${msg}`);
          },
          pass(msg) {
            setBadge(id, "pass", msg);
            results.push({ id, status: "pass", msg });
          },
          fail(msg) {
            setBadge(id, "fail", msg);
            results.push({ id, status: "fail", msg });
          },
          skip(msg) {
            setBadge(id, "skip", msg);
            results.push({ id, status: "skip", msg });
          },
        };
      }

      function setBadge(id, status, msg) {
        const b = document.getElementById(`badge-${id}`);
        b.className = `badge badge-${status}`;
        b.textContent = status.toUpperCase();
        if (msg)
          document.getElementById(`detail-${id}`).textContent += `=> ${msg}\n`;
      }

      function showSummary() {
        const pass = results.filter((r) => r.status === "pass").length;
        const fail = results.filter((r) => r.status === "fail").length;
        const skip = results.filter((r) => r.status === "skip").length;
        const total = results.length;
        const el = document.getElementById("summary");
        const color = fail === 0 ? "#16a34a" : "#dc2626";
        el.innerHTML =
          `<div class="big" style="color:${color}">${pass}/${total} phases passed</div>` +
          (fail > 0
            ? `<div style="color:#f87171;margin-top:8px">${fail} failed</div>`
            : "") +
          (skip > 0
            ? `<div style="color:#fbbf24;margin-top:4px">${skip} skipped</div>`
            : "");
      }

      // ======================================================================
      // Phase 1: WebGPU API Availability
      // ======================================================================
      async function phase1() {
        const p = phaseEl(1, "WebGPU API Availability");
        try {
          p.log(`navigator.gpu exists: ${!!navigator.gpu}`);
          if (!navigator.gpu) {
            p.fail("navigator.gpu is not available");
            return false;
          }
          p.log(
            `getPreferredCanvasFormat: ${navigator.gpu.getPreferredCanvasFormat()}`,
          );
          p.pass("WebGPU API available");
          return true;
        } catch (e) {
          p.fail(e.message);
          return false;
        }
      }

      // ======================================================================
      // Phase 2: Adapter & Device
      // ======================================================================
      let gpu_adapter, gpu_device;
      async function phase2() {
        const p = phaseEl(2, "GPU Adapter & Device Creation");
        try {
          gpu_adapter = await navigator.gpu.requestAdapter({
            powerPreference: "high-performance",
          });
          if (!gpu_adapter) {
            p.fail("No adapter returned");
            return false;
          }
          p.log(`Adapter: ${gpu_adapter.info?.device || "unknown"}`);
          p.log(`Features: ${[...gpu_adapter.features].join(", ") || "none"}`);
          gpu_device = await gpu_adapter.requestDevice();
          p.log(
            `Device created, maxTextureDimension2D: ${gpu_device.limits.maxTextureDimension2D}`,
          );
          p.log(
            `maxVertexAttributes: ${gpu_device.limits.maxVertexAttributes}`,
          );
          p.pass("Adapter + Device created");
          return true;
        } catch (e) {
          p.fail(e.message);
          return false;
        }
      }

      // ======================================================================
      // Phase 3: Canvas Context Configuration
      // ======================================================================
      let gpu_ctx, gpu_format;
      async function phase3() {
        const p = phaseEl(3, "Canvas Context Configuration");
        try {
          const canvas = document.getElementById("directCanvas");
          gpu_ctx = canvas.getContext("webgpu");
          if (!gpu_ctx) {
            p.fail('getContext("webgpu") returned null');
            return false;
          }
          gpu_format = navigator.gpu.getPreferredCanvasFormat();
          gpu_ctx.configure({
            device: gpu_device,
            format: gpu_format,
            alphaMode: "opaque",
          });
          p.log(`Canvas configured, format: ${gpu_format}`);
          p.pass("Canvas context configured");
          return true;
        } catch (e) {
          p.fail(e.message);
          return false;
        }
      }

      // ======================================================================
      // Phase 4: WGSL Shader Compilation
      // ======================================================================
      const TRIANGLE_WGSL = `
struct VertexOutput { @builtin(position) pos: vec4<f32>, @location(0) color: vec4<f32> }
@vertex fn vs(@builtin(vertex_index) vi: u32) -> VertexOutput {
  var positions = array<vec2<f32>,3>( vec2(0.0,0.5), vec2(-0.5,-0.5), vec2(0.5,-0.5) );
  var colors    = array<vec3<f32>,3>( vec3(1,0,0), vec3(0,1,0), vec3(0,0,1) );
  var out: VertexOutput;
  out.pos = vec4<f32>(positions[vi], 0.0, 1.0);
  out.color = vec4<f32>(colors[vi], 1.0);
  return out;
}
@fragment fn fs(in: VertexOutput) -> @location(0) vec4<f32> { return in.color; }
`;

      const BOX_WGSL = `
struct Uniforms { mvp: mat4x4<f32> }
@group(0) @binding(0) var<uniform> u: Uniforms;
struct VIn { @location(0) pos: vec3<f32>, @location(1) col: vec4<f32> }
struct VOut { @builtin(position) pos: vec4<f32>, @location(0) col: vec4<f32> }
@vertex fn vs(inp: VIn) -> VOut {
  var o: VOut;
  o.pos = u.mvp * vec4<f32>(inp.pos, 1.0);
  o.col = inp.col;
  return o;
}
@fragment fn fs(inp: VOut) -> @location(0) vec4<f32> { return inp.col; }
`;

      let triangleModule, boxModule;
      async function phase4() {
        const p = phaseEl(4, "WGSL Shader Compilation");
        try {
          triangleModule = gpu_device.createShaderModule({
            code: TRIANGLE_WGSL,
            label: "Triangle Shader",
          });
          const info1 = await triangleModule.getCompilationInfo();
          const errs1 = info1.messages.filter((m) => m.type === "error");
          p.log(`Triangle shader: ${errs1.length} errors`);
          if (errs1.length > 0) {
            p.fail(
              "Triangle shader errors: " +
                errs1.map((m) => m.message).join("; "),
            );
            return false;
          }

          boxModule = gpu_device.createShaderModule({
            code: BOX_WGSL,
            label: "Box Shader",
          });
          const info2 = await boxModule.getCompilationInfo();
          const errs2 = info2.messages.filter((m) => m.type === "error");
          p.log(`Box shader: ${errs2.length} errors`);
          if (errs2.length > 0) {
            p.fail(
              "Box shader errors: " + errs2.map((m) => m.message).join("; "),
            );
            return false;
          }

          p.pass("Both shaders compiled successfully");
          return true;
        } catch (e) {
          p.fail(e.message);
          return false;
        }
      }

      // ======================================================================
      // Phase 5: Buffer Creation (Vertex, Index, Uniform)
      // ======================================================================
      let boxVB, boxIB, boxUB;
      async function phase5() {
        const p = phaseEl(5, "Buffer Creation (Vertex, Index, Uniform)");
        try {
          // Box vertices: 8 corners, each with pos(3) + color(4) = 7 floats
          const S = 0.4;
          const verts = new Float32Array([
            -S,
            -S,
            -S,
            1,
            0,
            0,
            1,
            S,
            -S,
            -S,
            0,
            1,
            0,
            1,
            S,
            S,
            -S,
            0,
            0,
            1,
            1,
            -S,
            S,
            -S,
            1,
            1,
            0,
            1,
            -S,
            -S,
            S,
            1,
            0,
            1,
            1,
            S,
            -S,
            S,
            0,
            1,
            1,
            1,
            S,
            S,
            S,
            1,
            1,
            1,
            1,
            -S,
            S,
            S,
            0.5,
            0.5,
            0.5,
            1,
          ]);
          boxVB = gpu_device.createBuffer({
            size: verts.byteLength,
            usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
            label: "BoxVB",
          });
          gpu_device.queue.writeBuffer(boxVB, 0, verts);
          p.log(
            `Vertex buffer: ${verts.byteLength} bytes, ${verts.length / 7} vertices`,
          );

          const idx = new Uint16Array([
            0, 1, 2, 0, 2, 3, 1, 5, 6, 1, 6, 2, 5, 4, 7, 5, 7, 6, 4, 0, 3, 4, 3,
            7, 3, 2, 6, 3, 6, 7, 4, 5, 1, 4, 1, 0,
          ]);
          boxIB = gpu_device.createBuffer({
            size: idx.byteLength,
            usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
            label: "BoxIB",
          });
          gpu_device.queue.writeBuffer(boxIB, 0, idx);
          p.log(
            `Index buffer: ${idx.byteLength} bytes, ${idx.length} indices (${idx.length / 3} triangles)`,
          );

          boxUB = gpu_device.createBuffer({
            size: 256,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            label: "BoxUB",
          });
          p.log(`Uniform buffer: 256 bytes (aligned)`);

          p.pass("All buffers created");
          return true;
        } catch (e) {
          p.fail(e.message);
          return false;
        }
      }

      // ======================================================================
      // Phase 6: Render Pipeline Creation
      // ======================================================================
      let trianglePipeline, boxPipeline, boxBindGroupLayout, boxBindGroup;
      async function phase6() {
        const p = phaseEl(6, "Render Pipeline Creation");
        try {
          // Simple triangle pipeline (no vertex buffers, uses vertex_index)
          trianglePipeline = gpu_device.createRenderPipeline({
            layout: "auto",
            vertex: { module: triangleModule, entryPoint: "vs" },
            fragment: {
              module: boxModule.device ? triangleModule : triangleModule,
              entryPoint: "fs",
              targets: [{ format: gpu_format }],
            },
            primitive: { topology: "triangle-list" },
          });
          p.log("Triangle pipeline created (auto layout, no depth)");

          // Box pipeline with depth + uniform bind group
          const depthFormat = "depth24plus-stencil8";
          boxBindGroupLayout = gpu_device.createBindGroupLayout({
            entries: [
              {
                binding: 0,
                visibility: GPUShaderStage.VERTEX,
                buffer: { type: "uniform" },
              },
            ],
          });
          boxPipeline = gpu_device.createRenderPipeline({
            layout: gpu_device.createPipelineLayout({
              bindGroupLayouts: [boxBindGroupLayout],
            }),
            vertex: {
              module: boxModule,
              entryPoint: "vs",
              buffers: [
                {
                  arrayStride: 28,
                  attributes: [
                    { shaderLocation: 0, offset: 0, format: "float32x3" },
                    { shaderLocation: 1, offset: 12, format: "float32x4" },
                  ],
                },
              ],
            },
            fragment: {
              module: boxModule,
              entryPoint: "fs",
              targets: [{ format: gpu_format }],
            },
            primitive: { topology: "triangle-list", cullMode: "back" },
            depthStencil: {
              format: depthFormat,
              depthWriteEnabled: true,
              depthCompare: "less",
            },
          });
          p.log("Box pipeline created (with depth stencil, cull back)");

          boxBindGroup = gpu_device.createBindGroup({
            layout: boxBindGroupLayout,
            entries: [{ binding: 0, resource: { buffer: boxUB } }],
          });
          p.log("Bind group created");

          p.pass("Pipelines + bind group created");
          return true;
        } catch (e) {
          p.fail(e.message);
          return false;
        }
      }

      // ======================================================================
      // Phase 7: Direct WebGPU Draw (Triangle + Box)
      // ======================================================================
      async function phase7() {
        const p = phaseEl(7, "Direct WebGPU Draw (Triangle + Spinning Box)");
        try {
          const canvas = document.getElementById("directCanvas");

          // Build a simple perspective MVP for the box
          function makeMVP(angle) {
            const aspect = canvas.width / canvas.height;
            const fov = Math.PI / 4;
            const near = 0.1,
              far = 100;
            const f = 1 / Math.tan(fov / 2);
            // Column-major perspective
            const P = new Float32Array(16);
            P[0] = f / aspect;
            P[5] = f;
            P[10] = (far + near) / (near - far);
            P[11] = -1;
            P[14] = (2 * far * near) / (near - far);

            // View: lookAt from (0,0,3) to origin
            const V = new Float32Array(16);
            V[0] = 1;
            V[5] = 1;
            V[10] = 1;
            V[15] = 1;
            V[14] = -3;

            // Model: rotate Y
            const c = Math.cos(angle),
              s = Math.sin(angle);
            const M = new Float32Array(16);
            M[0] = c;
            M[2] = s;
            M[5] = 1;
            M[8] = -s;
            M[10] = c;
            M[15] = 1;

            // MVP = P * V * M  (manual multiply, column major)
            function mul(A, B) {
              const R = new Float32Array(16);
              for (let i = 0; i < 4; i++)
                for (let j = 0; j < 4; j++) {
                  let v = 0;
                  for (let k = 0; k < 4; k++) v += A[i + k * 4] * B[k + j * 4];
                  R[i + j * 4] = v;
                }
              return R;
            }
            return mul(P, mul(V, M));
          }

          // Create depth texture
          const depthTex = gpu_device.createTexture({
            size: { width: canvas.width, height: canvas.height },
            format: "depth24plus-stencil8",
            usage: GPUTextureUsage.RENDER_ATTACHMENT,
          });

          let frame = 0;
          let ok = false;
          function drawFrame() {
            frame++;
            const angle = frame * 0.02;

            // Write MVP
            const mvp = makeMVP(angle);
            gpu_device.queue.writeBuffer(boxUB, 0, mvp);

            const encoder = gpu_device.createCommandEncoder();
            const texView = gpu_ctx.getCurrentTexture().createView();
            const pass = encoder.beginRenderPass({
              colorAttachments: [
                {
                  view: texView,
                  clearValue: { r: 0.04, g: 0.04, b: 0.06, a: 1 },
                  loadOp: "clear",
                  storeOp: "store",
                },
              ],
              depthStencilAttachment: {
                view: depthTex.createView(),
                depthClearValue: 1,
                depthLoadOp: "clear",
                depthStoreOp: "store",
                stencilClearValue: 0,
                stencilLoadOp: "clear",
                stencilStoreOp: "store",
              },
            });

            // Draw box
            pass.setPipeline(boxPipeline);
            pass.setBindGroup(0, boxBindGroup);
            pass.setVertexBuffer(0, boxVB);
            pass.setIndexBuffer(boxIB, "uint16");
            pass.drawIndexed(36);

            pass.end();
            gpu_device.queue.submit([encoder.finish()]);

            if (frame < 120) requestAnimationFrame(drawFrame);
          }

          drawFrame();
          ok = true;
          p.log("Spinning box rendering started (120 frames)");
          p.pass("Direct WebGPU draw successful");
          return true;
        } catch (e) {
          p.fail(e.message);
          return false;
        }
      }

      // ======================================================================
      // Phase 8: Cesium Scene.createAsync with WebGPU
      // ======================================================================
      let cesiumScene;
      async function phase8() {
        const p = phaseEl(8, "Cesium Scene.createAsync (WebGPU)");
        try {
          const canvas = document.getElementById("sceneCanvas");
          cesiumScene = await Cesium.Scene.createAsync(
            {
              canvas: canvas,
              contextOptions: { renderer: "webgpu" },
              scene3DOnly: true,
            },
            (progress, status) => {
              p.log(`Progress: ${progress}% - ${status}`);
            },
          );
          p.log(`Scene created, isWebGPU: ${cesiumScene.isWebGPU}`);
          p.log(`Context type: ${cesiumScene.context.rendererType}`);
          p.log(
            `Drawing buffer: ${cesiumScene.context.drawingBufferWidth}x${cesiumScene.context.drawingBufferHeight}`,
          );
          if (!cesiumScene.isWebGPU) {
            p.fail("Scene is NOT using WebGPU");
            return false;
          }
          p.pass("Scene created with WebGPU");
          return true;
        } catch (e) {
          p.fail(e.message);
          return false;
        }
      }

      // ======================================================================
      // Phase 9: Cesium Primitive + Geometry Processing
      // ======================================================================
      let testPrimitive;
      async function phase9() {
        const p = phaseEl(9, "Cesium Primitive Creation & Geometry Processing");
        try {
          // Create a box geometry instance
          const boxGeom = Cesium.BoxGeometry.fromDimensions({
            dimensions: new Cesium.Cartesian3(400000, 400000, 400000),
            vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT,
          });

          const position = Cesium.Cartesian3.fromDegrees(-75.0, 40.0, 300000);
          const modelMatrix =
            Cesium.Transforms.eastNorthUpToFixedFrame(position);

          const instance = new Cesium.GeometryInstance({
            geometry: Cesium.BoxGeometry.createGeometry(boxGeom),
            modelMatrix: modelMatrix,
            id: "webgpu-test-box",
            attributes: {
              color: Cesium.ColorGeometryInstanceAttribute.fromColor(
                Cesium.Color.CYAN,
              ),
            },
          });
          p.log("GeometryInstance created (400km box over Philadelphia)");

          testPrimitive = new Cesium.Primitive({
            geometryInstances: instance,
            appearance: new Cesium.PerInstanceColorAppearance({ flat: true }),
            asynchronous: false,
          });
          p.log("Primitive created (synchronous, flat appearance)");

          cesiumScene.primitives.add(testPrimitive);
          p.log("Primitive added to scene");

          // Set camera to look at the box
          cesiumScene.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(-75.0, 40.0, 1500000),
            orientation: {
              heading: 0,
              pitch: Cesium.Math.toRadians(-45),
              roll: 0,
            },
          });
          p.log("Camera positioned (1500km above Philadelphia, -45deg pitch)");

          p.pass("Primitive & camera configured");
          return true;
        } catch (e) {
          p.fail(e.message);
          return false;
        }
      }

      // ======================================================================
      // Phase 10: Full Scene Render Loop
      // ======================================================================
      async function phase10() {
        const p = phaseEl(10, "Full Scene Render Loop");
        try {
          cesiumScene.backgroundColor =
            Cesium.Color.fromCssColorString("#0a0a0f");

          let frameCount = 0;
          let primitiveReady = false;
          let commandsGenerated = false;
          let renderError = null;
          let webgpuCommandsSeen = 0;
          let renderPassActive = false;
          let commandsExecuted = 0;

          // Intercept errors
          cesiumScene.rethrowRenderErrors = false;
          cesiumScene.renderError.addEventListener((scene, error) => {
            renderError = error;
            p.log(`RENDER ERROR: ${error.message}`);
            if (error.stack)
              p.log(error.stack.split("\n").slice(0, 5).join("\n"));
          });

          // Diagnostic: Check if context has render pass after beginFrame
          const ctx = cesiumScene.context;
          p.log(`Context type: ${ctx.rendererType}, isWebGPU: ${ctx.isWebGPU}`);
          p.log(
            `Device: ${!!ctx.device}, presentationFormat: ${ctx.presentationFormat}`,
          );
          p.log(
            `Canvas size: ${ctx.drawingBufferWidth}x${ctx.drawingBufferHeight}`,
          );
          p.log(`Scene.isWebGPU: ${cesiumScene.isWebGPU}`);
          p.log(
            `Depth range type: ${Cesium.Matrix4._depthRangeType || "unknown"}`,
          );

          function renderFrame() {
            frameCount++;
            try {
              cesiumScene.render();
            } catch (e) {
              renderError = e;
              p.log(`Frame ${frameCount} exception: ${e.message}`);
              if (e.stack) p.log(e.stack.split("\n").slice(0, 3).join("\n"));
            }

            // Check if render pass was active during frame
            if (frameCount <= 3) {
              const hasRenderPass = !!ctx.currentRenderPassEncoder;
              p.log(
                `Frame ${frameCount}: renderPassActive=${hasRenderPass} (after render, expected: null/false)`,
              );
            }

            // Check primitive state
            if (!primitiveReady && testPrimitive.ready) {
              primitiveReady = true;
              p.log(`Frame ${frameCount}: Primitive became READY`);

              // Log WebGPU cache state
              if (testPrimitive._webgpuCache) {
                const cache = testPrimitive._webgpuCache;
                p.log(
                  `  Cache: shader=${cache.shaderType}, pipeline=${!!cache.pipeline}`,
                );
                p.log(
                  `  VBs=${cache.vertexBuffers.length}, IBs=${cache.indexBuffers.length}, UBs=${cache.uniformBuffers.length}`,
                );
              }
              if (testPrimitive._webgpuGeometryData) {
                const geomData = testPrimitive._webgpuGeometryData;
                p.log(
                  `  Geometry data preserved: ${geomData.length} geometries`,
                );
                for (let g = 0; g < geomData.length; g++) {
                  const attrs = Object.keys(geomData[g].attributes);
                  p.log(
                    `    Geom ${g}: attrs=[${attrs.join(",")}], indices=${geomData[g].indices?.length || 0}`,
                  );
                }
              }
            }

            // Check command list
            const cmdList = cesiumScene.frameState.commandList;
            if (cmdList.length > 0 && !commandsGenerated) {
              commandsGenerated = true;
              let webgpuCount = 0;
              let webglCount = 0;
              let clearCount = 0;
              for (let i = 0; i < cmdList.length; i++) {
                if (cmdList[i].isWebGPUDrawCommand) webgpuCount++;
                else if (
                  cmdList[i]._clearColor !== undefined ||
                  cmdList[i].color !== undefined
                )
                  clearCount++;
                else webglCount++;
              }
              webgpuCommandsSeen = webgpuCount;
              p.log(
                `Frame ${frameCount}: ${cmdList.length} commands (${webgpuCount} WebGPU, ${webglCount} WebGL, ${clearCount} clear)`,
              );

              // Log details of first WebGPU command
              for (let i = 0; i < cmdList.length; i++) {
                if (cmdList[i].isWebGPUDrawCommand) {
                  const cmd = cmdList[i];
                  p.log(
                    `  WebGPU cmd[${i}]: pass=${cmd.pass}, indexCount=${cmd.indexCount}, vertexCount=${cmd.vertexCount}`,
                  );
                  p.log(
                    `    pipeline=${!!cmd.pipeline}, bindGroups=${cmd.bindGroups?.length}, vertexBuffers=${cmd.vertexBuffers?.length}`,
                  );
                  p.log(
                    `    boundingVolume=${!!cmd.boundingVolume}, cull=${cmd.cull}, enabled=${cmd.enabled}`,
                  );
                  if (cmd.boundingVolume) {
                    const bv = cmd.boundingVolume;
                    p.log(
                      `    BV center=(${bv.center?.x?.toFixed(0)},${bv.center?.y?.toFixed(0)},${bv.center?.z?.toFixed(0)}) r=${bv.radius?.toFixed(0)}`,
                    );
                  }
                  if (cmd._webgpuShaderType) {
                    p.log(
                      `    shaderType=${cmd._webgpuShaderType}, uniformBuf=${!!cmd._webgpuUniformBuffer}`,
                    );
                  }
                  break;
                }
              }
            }

            if (frameCount <= 3) {
              p.log(
                `Frame ${frameCount}: ready=${testPrimitive.ready}, state=${testPrimitive._state}, cmds=${cmdList.length}, VA=${testPrimitive._va?.length || 0}, colorCmds=${testPrimitive._colorCommands?.length || 0}`,
              );
            }

            if (frameCount < 30) {
              requestAnimationFrame(renderFrame);
            } else {
              // Final assessment
              p.log(`\n--- Final Assessment after ${frameCount} frames ---`);
              p.log(`Primitive ready: ${primitiveReady}`);
              p.log(`Commands generated: ${commandsGenerated}`);
              p.log(`WebGPU commands seen: ${webgpuCommandsSeen}`);
              p.log(
                `Render errors: ${renderError ? renderError.message : "NONE"}`,
              );

              // Check canvas pixels to detect if anything was drawn
              try {
                const canvas = document.getElementById("sceneCanvas");
                const tempCanvas = document.createElement("canvas");
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext("2d");
                tempCtx.drawImage(canvas, 0, 0);
                const imageData = tempCtx.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height,
                );
                const pixels = imageData.data;
                let nonBlackPixels = 0;
                let totalChecked = 0;
                // Sample every 10th pixel
                for (let px = 0; px < pixels.length; px += 40) {
                  totalChecked++;
                  if (
                    pixels[px] > 5 ||
                    pixels[px + 1] > 5 ||
                    pixels[px + 2] > 5
                  ) {
                    nonBlackPixels++;
                  }
                }
                p.log(
                  `Canvas pixel check: ${nonBlackPixels}/${totalChecked} non-black pixels (${((nonBlackPixels / totalChecked) * 100).toFixed(1)}%)`,
                );
              } catch (e) {
                p.log(`Canvas pixel check failed: ${e.message}`);
              }

              if (renderError) {
                p.fail(`Render error: ${renderError.message}`);
              } else if (!primitiveReady) {
                p.fail("Primitive never became ready after 30 frames");
              } else if (!commandsGenerated) {
                p.fail("No draw commands generated");
              } else if (webgpuCommandsSeen === 0) {
                p.fail(
                  "No WebGPU draw commands generated (only WebGL commands)",
                );
              } else {
                p.pass(
                  `${webgpuCommandsSeen} WebGPU command(s) rendered successfully over ${frameCount} frames`,
                );
              }

              showSummary();
            }
          }

          renderFrame();
          return true; // async continues in rAF
        } catch (e) {
          p.fail(e.message);
          showSummary();
          return false;
        }
      }

      // ======================================================================
      // Run all phases
      // ======================================================================
      async function runAll() {
        const ok1 = await phase1();
        if (!ok1) {
          showSummary();
          return;
        }

        const ok2 = await phase2();
        if (!ok2) {
          showSummary();
          return;
        }

        const ok3 = await phase3();
        if (!ok3) {
          showSummary();
          return;
        }

        const ok4 = await phase4();
        if (!ok4) {
          showSummary();
          return;
        }

        const ok5 = await phase5();
        const ok6 = await phase6();

        if (ok5 && ok6) {
          await phase7();
        } else {
          phaseEl(7, "Direct WebGPU Draw").skip(
            "Skipped due to earlier failure",
          );
        }

        const ok8 = await phase8();
        if (!ok8) {
          phaseEl(9, "Primitive Creation").skip("Scene creation failed");
          phaseEl(10, "Full Scene Render").skip("Scene creation failed");
          showSummary();
          return;
        }

        const ok9 = await phase9();
        if (!ok9) {
          phaseEl(10, "Full Scene Render").skip("Primitive creation failed");
          showSummary();
          return;
        }

        await phase10();
        // Summary shown after phase 10 rAF loop completes
      }

      runAll().catch((e) => {
        console.error("Top-level error:", e);
        const el = document.getElementById("summary");
        el.innerHTML = `<div style="color:#f87171">Fatal error: ${e.message}</div>`;
      });
    </script>
  </body>
</html>
