name: dev
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: lint *.js
        run: npm run eslint
      - name: lint *.md
        run: npm run markdownlint
      - name: format code
        run: npm run prettier-check
      - name: build
        run: npm run build
      - name: tsc
        run: npm run tsc
  coverage:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: build
        run: npm run build
      - name: coverage (firefox)
        run: npm run coverage -- --browsers FirefoxHeadless --webgl-stub --failTaskOnError --suppressPassed
      - name: upload coverage artifacts
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: aws s3 sync ./Build/Coverage s3://cesium-public-builds/cesium/$BRANCH/Build/Coverage --delete --color on
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: release build
        run: npm run make-zip
      - name: release tests (chrome)
        run: npm run test -- --browsers ChromeHeadless --failTaskOnError --webgl-stub --release --suppressPassed
      - name: cloc
        run: npm run cloc
  node-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: npm install
        run: npm install
      - name: release build
        run: npm run build-release
      - name: package cesium module
        run: npm pack &> /dev/null
      - name: package workspace modules
        run: npm pack --workspaces &> /dev/null
      - uses: ./.github/actions/verify-package
  # Bundle-variant build + runtime smoke (NEW-VARIANT-CI, Batch 242).
  # The webgl-only variant build was broken for an unknown period
  # (NEW-WEBGL-ONLY-CLUSTER-EXPORT-GATING, Batch 224) because nothing in
  # CI exercised the variant tasks — this job closes that blind spot.
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      # Build ALL three variants (dual / webgl-only / webgpu-only) — the
      # ESM static named-re-export class of break (Batch 224) hits at
      # BUILD time for either non-dual variant, so build-checking both is
      # cheap insurance even though only webgl-only can run here.
      - name: build variants
        run: npx gulp buildAllVariants
      - name: install playwright + chromium
        run: npx playwright install --with-deps chromium
      # No server step: variant-smoke-test.mjs self-serves the Build/
      # artifacts on an ephemeral port (Batch 243). The previous
      # backgrounded `npm run start` died when its step shell exited,
      # so the smoke navigation hit ERR_CONNECTION_REFUSED.
      # Runtime smoke for the webgl-only variant ONLY. GitHub-hosted
      # runners have no WebGPU adapter (same constraint documented in
      # visual-regression.yml), so the dual/webgpu-only variant smokes and
      # the Sandcastle WebGPU smoke
      # (Tools/visual-regression/sandcastle-smoke.mjs) are LOCAL-REQUIRED
      # gates — see "Probe inventory" in migration_doc/DEBUGGING_GUIDE.md.
      # Headless Chromium WebGL renders via SwiftShader on the runner.
      - name: variant smoke (webgl-only)
        run: node Tools/variant-smoke-test.mjs --variant webgl-only --browser chromium
