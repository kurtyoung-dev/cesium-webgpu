name: dev
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: lint *.js
        run: npm run eslint
      - name: lint *.md
        run: npm run markdownlint
      - name: format code
        run: npm run prettier-check
      - name: build
        run: npm run build
      - name: tsc
        run: npm run tsc
  coverage:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: build
        run: npm run build
      - name: coverage (firefox)
        run: npm run coverage -- --browsers FirefoxHeadless --webgl-stub --failTaskOnError --suppressPassed
      - name: upload coverage artifacts
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: aws s3 sync ./Build/Coverage s3://cesium-public-builds/cesium/$BRANCH/Build/Coverage --delete --color on
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: release build
        run: npm run make-zip
      - name: release tests (chrome)
        run: npm run test -- --browsers ChromeHeadless --failTaskOnError --webgl-stub --release --suppressPassed
      - name: cloc
        run: npm run cloc
  node-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: npm install
        run: npm install
      - name: release build
        run: npm run build-release
      - name: package cesium module
        run: npm pack &> /dev/null
      - name: package workspace modules
        run: npm pack --workspaces &> /dev/null
      - uses: ./.github/actions/verify-package
  # Bundle-variant build + runtime smoke (NEW-VARIANT-CI, Batch 242).
  # The webgl-only variant build was broken for an unknown period
  # (NEW-WEBGL-ONLY-CLUSTER-EXPORT-GATING, Batch 224) because nothing in
  # CI exercised the variant tasks — this job closes that blind spot.
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      # Build ALL three variants (dual / webgl-only / webgpu-only) — the
      # ESM static named-re-export class of break (Batch 224) hits at
      # BUILD time for either non-dual variant, so build-checking both is
      # cheap insurance even though only webgl-only can run here.
      - name: build variants
        run: npx gulp buildAllVariants
      - name: install playwright + chromium
        run: npx playwright install --with-deps chromium
      # No server step: variant-smoke-test.mjs self-serves the Build/
      # artifacts on an ephemeral port (Batch 243). The previous
      # backgrounded `npm run start` died when its step shell exited,
      # so the smoke navigation hit ERR_CONNECTION_REFUSED.
      # Headless Chromium WebGL renders via SwiftShader on the runner.
      - name: variant smoke (webgl-only)
        run: node Tools/variant-smoke-test.mjs --variant webgl-only --browser chromium
      # WebGPU variant smokes on SwiftShader (Batch 246,
      # NEW-WEBGPU-DEFAULT-LIMIT-GLOBE-LAYOUT). Previously LOCAL-REQUIRED:
      # SwiftShader reports the WebGPU spec-floor limits
      # (maxSampledTexturesPerShaderStage=16) and the globe terrain
      # pipeline layout needed 31 sampled textures, so the smoke died at
      # CreatePipelineLayout. The Batch-246 reduced imagery layout fits
      # the floor; verified locally against a real SwiftShader adapter
      # (Edge channel, vendor=google/architecture=swiftshader): pre-fix
      # build FAILs with "sampled textures (31) ... exceeds (16)",
      # post-fix dual + webgpu-only both PASS.
      #
      # FIRST-HOSTED-RUN CAVEAT: the hosted ubuntu runner's bundled
      # Chromium must expose the SwiftShader Vulkan WebGPU adapter under
      # `--use-webgpu-adapter=swiftshader` (verified locally on Windows
      # via the Edge channel; Linux-runner behavior unverified until this
      # job's first run). If the adapter is missing, the smoke fails with
      # "no adapter" — in that case revert these two steps to
      # LOCAL-REQUIRED and note the runner's Chromium version in
      # NEW-WEBGPU-DEFAULT-LIMIT-GLOBE-LAYOUT (DEFERRED_WORK.md).
      - name: variant smoke (dual, SwiftShader WebGPU)
        run: node Tools/variant-smoke-test.mjs --variant dual --browser chromium --webgpu-adapter swiftshader
      - name: variant smoke (webgpu-only, SwiftShader WebGPU)
        run: node Tools/variant-smoke-test.mjs --variant webgpu-only --browser chromium --webgpu-adapter swiftshader
