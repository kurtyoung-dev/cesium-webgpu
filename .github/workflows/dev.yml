name: dev
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: lint *.js
        run: npm run eslint
      - name: lint *.md
        run: npm run markdownlint
      - name: format code
        run: npm run prettier-check
      - name: build
        run: npm run build
      - name: tsc
        run: npm run tsc
      - name: sg test
        run: npm exec --package=@ast-grep/cli --offline -- sg test
      - name: sg scan
        run: npm exec --package=@ast-grep/cli --offline -- sg scan --context 3
  # Repo-local guard scripts, run on every push and pull request.
  #
  # These checks existed and were green for months without anything in CI
  # running them, so a change that broke one only surfaced when somebody
  # happened to run it by hand. This job closes that gap.
  #
  # There is deliberately NO build step here. Every wired guard reads tracked
  # sources and repo configuration only, which is what makes this job fast and
  # independent of the (multi-minute) engine build. `verify-tracked-references`
  # belongs in this group for the same reason: it takes tracked-ness from
  # `git ls-files` and existence from disk, so generated build output is
  # irrelevant to it. A spec asserts the no-build property rather than trusting
  # this comment.
  #
  # excluded, with the reason each was measured to fail here (re-measured
  # 2026-08-28 after the census stabilized - the earlier drift reasons are
  # superseded):
  #   - verify-tooling-catalog: refuses outright on this job's checkout. The
  #     freshness column reads real commit dates, so the tool rejects a
  #     truncated history as an ineligible subject ("candidate Git history is
  #     shallow", exit 3 STRUCTURAL) before comparing anything. Wiring it needs
  #     fetch-depth: 0, plus a ritual that regenerates the census in any commit
  #     touching Tools/ or scripts/ - the advisory allowance covers only the
  #     head commit's own files, so drift across two consecutive tooling
  #     commits reds the check.
  #   - test-tooling-catalog: green in a complete clone (91/91). It runs the
  #     launcher against this repository ~49 times, so it inherits the shallow
  #     refusal above - not a red set.
  #   - verify-landing: a local and pre-push gate. It resolves the
  #     monotonic-batch baseline from full history before counting a range, so
  #     on a depth-1 checkout every invocation is STRUCTURAL regardless of
  #     range.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: lint comment markers
        run: npm run lint-comment-markers
      - name: lint debug pragmas
        run: npm run lint-debug-pragmas
      - name: comment remediation tests
        run: npm run test-c16
      - name: landing rule tests
        run: npm run test-landing-rules
      - name: build infrastructure tests
        run: npm run test-build-infra
      - name: webgpu policy tests
        run: npm run test-webgpu-policy
      - name: audit feature renderers
        run: npm run audit-feature-renderers
      - name: collection sentinel checks
        run: npm run collection-sentinels-check
      - name: verify tracked references
        run: npm run verify-tracked-references
  coverage:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: build
        run: npm run build
      - name: coverage (firefox)
        run: npm run coverage -- --browsers FirefoxHeadless --webgl-stub --failTaskOnError --suppressPassed
      - name: upload coverage artifacts
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: aws s3 sync ./Build/Coverage s3://cesium-public-builds/cesium/$BRANCH/Build/Coverage --delete --color on
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      - name: release build
        run: npm run make-zip
      - name: release tests (chrome)
        run: npm run test -- --browsers ChromeHeadless --failTaskOnError --webgl-stub --release --suppressPassed
      - name: cloc
        run: npm run cloc
  node-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - name: install node ${{ matrix.version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.version }}
      - name: npm install
        run: npm install
      - name: release build
        run: npm run build-release
      - name: package cesium module
        run: npm pack &> /dev/null
      - name: package workspace modules
        run: npm pack --workspaces &> /dev/null
      - uses: ./.github/actions/verify-package
  # Bundle-variant build + runtime smoke (NEW-VARIANT-CI, Batch 242).
  # The webgl-only variant build was broken for an unknown period
  # (NEW-WEBGL-ONLY-CLUSTER-EXPORT-GATING, Batch 224) because nothing in
  # CI exercised the variant tasks — this job closes that blind spot.
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: install node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: npm install
        run: npm install
      # Build ALL three variants (dual / webgl-only / webgpu-only) — the
      # ESM static named-re-export class of break (Batch 224) hits at
      # BUILD time for either non-dual variant, so build-checking both is
      # cheap insurance even though only webgl-only can run here.
      - name: build variants
        run: npx gulp buildAllVariants
      - name: install playwright + chromium
        run: npx playwright install --with-deps chromium
      # No server step: variant-smoke-test.mjs self-serves the Build/
      # artifacts on an ephemeral port (Batch 243). The previous
      # backgrounded `npm run start` died when its step shell exited,
      # so the smoke navigation hit ERR_CONNECTION_REFUSED.
      # Headless Chromium WebGL renders via SwiftShader on the runner.
      - name: variant smoke (webgl-only)
        run: node Tools/variant-smoke-test.mjs --variant webgl-only --browser chromium
      # The dual + webgpu-only SwiftShader-WebGPU smokes are LOCAL-REQUIRED
      # (Edge channel, run them via `node Tools/variant-smoke-test.mjs
      # --variant dual|webgpu-only --browser chromium --webgpu-adapter
      # swiftshader`) — NOT on this hosted job. Same constraint
      # `visual-regression.yml` already documents: WebGPU is a local Edge
      # gate, not a hosted-runner gate.
      #
      # Batch 246 (NEW-WEBGPU-DEFAULT-LIMIT-GLOBE-LAYOUT) added the two
      # hosted SwiftShader steps speculatively, with a caveat that *if*
      # they failed it would be a "no adapter" failure to revert on.
      # The first hosted run (gh run 27453157697, Chrome for Testing
      # 148.0.7778.96 / playwright chromium v1223) failed differently:
      # the SwiftShader Vulkan adapter WAS present (navigator.gpu=true,
      # armedDevices=1, deviceLost=no at boot) and the Batch-246 layout
      # fix held (the "(31) exceeds (16)" CreatePipelineLayout error was
      # absent), but the SwiftShader Vulkan *instance* destabilized
      # mid-frame: "Device lost: destroyed / Device was destroyed",
      # "A valid external Instance reference no longer exists",
      # "Instance dropped error in getCompilationInfo" — 2769 errors.
      # That is a SwiftShader runtime-stability problem, not something
      # this repo can fix, so the WebGPU smokes go back to LOCAL-REQUIRED
      # per the pre-agreed fallback (Batch 259, NEW-CI-SWIFTSHADER-WEBGPU-
      # DEVICE-LOST in DEFERRED_WORK.md). The build-variants step above
      # still build-gates all three variants; the webgl-only smoke above
      # still runtime-gates the WebGL path on this hosted job.
