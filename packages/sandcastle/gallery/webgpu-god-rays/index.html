<style>
  @import url(../templates/bucket.css);
</style>
<div id="cesiumContainer" class="fullSize"></div>
<div id="loadingOverlay"><h1>Loading...</h1></div>
<div id="toolbar">
  <table>
    <tbody>
      <tr>
        <td>God Rays</td>
        <td><input type="checkbox" data-bind="checked: enabled" /></td>
      </tr>
      <tr>
        <td>Density</td>
        <td>
          <input
            type="range"
            min="0.1"
            max="2.0"
            step="0.01"
            data-bind="value: density, valueUpdate: 'input'"
          />
          <span data-bind="text: density"></span>
        </td>
      </tr>
      <tr>
        <td>Decay</td>
        <td>
          <input
            type="range"
            min="0.5"
            max="1.0"
            step="0.01"
            data-bind="value: decay, valueUpdate: 'input'"
          />
          <span data-bind="text: decay"></span>
        </td>
      </tr>
      <tr>
        <td>Weight</td>
        <td>
          <input
            type="range"
            min="0.0"
            max="2.0"
            step="0.01"
            data-bind="value: weight, valueUpdate: 'input'"
          />
          <span data-bind="text: weight"></span>
        </td>
      </tr>
      <tr>
        <td>Exposure</td>
        <td>
          <input
            type="range"
            min="0.0"
            max="1.0"
            step="0.01"
            data-bind="value: exposure, valueUpdate: 'input'"
          />
          <span data-bind="text: exposure"></span>
        </td>
      </tr>
      <tr>
        <td>Sample Count</td>
        <td>
          <input
            type="range"
            min="8"
            max="128"
            step="1"
            data-bind="value: sampleCount, valueUpdate: 'input'"
          />
          <span data-bind="text: sampleCount"></span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
