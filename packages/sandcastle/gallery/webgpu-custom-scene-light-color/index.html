<style>
  @import url(../templates/bucket.css);
</style>
<div id="cesiumContainer" class="fullSize"></div>
<div id="loadingOverlay"><h1>Loading...</h1></div>
<div id="toolbar">
  <table>
    <tbody>
      <tr>
        <td>Light color</td>
        <td>
          <input
            type="color"
            data-bind="value: lightColor, valueUpdate: 'input'"
          />
          <span data-bind="text: lightColor"></span>
        </td>
      </tr>
      <tr>
        <td>Intensity</td>
        <td>
          <input
            type="range"
            min="0.1"
            max="3.0"
            step="0.05"
            data-bind="value: intensity, valueUpdate: 'input'"
          />
          <span data-bind="text: intensity"></span>
        </td>
      </tr>
      <tr>
        <td>Enable lighting</td>
        <td>
          <input type="checkbox" data-bind="checked: enableLighting" />
          (Globe.enableLighting must be true for Lambert to apply)
        </td>
      </tr>
    </tbody>
  </table>
</div>
