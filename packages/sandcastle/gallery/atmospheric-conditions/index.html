<style>
  @import url(../templates/bucket.css);
</style>
<div id="cesiumContainer" class="fullSize"></div>
<div id="loadingOverlay"><h1>Loading...</h1></div>
<div id="toolbar">
  <table>
    <tbody>
      <tr>
        <td>Humidity</td>
        <td>
          <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            data-bind="value: humidity, valueUpdate: 'input'"
          />
        </td>
      </tr>
      <tr>
        <td>Air quality</td>
        <td>
          <input
            type="range"
            min="0.3"
            max="2"
            step="0.05"
            data-bind="value: airQuality, valueUpdate: 'input'"
          />
        </td>
      </tr>
      <tr>
        <td>Cloud cover</td>
        <td>
          <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            data-bind="value: cloudCover, valueUpdate: 'input'"
          />
        </td>
      </tr>
      <tr>
        <td>Wind speed (m/s)</td>
        <td>
          <input
            type="range"
            min="0"
            max="40"
            step="0.5"
            data-bind="value: windSpeed, valueUpdate: 'input'"
          />
        </td>
      </tr>
      <tr>
        <td>Wind heading (°)</td>
        <td>
          <input
            type="range"
            min="0"
            max="360"
            step="1"
            data-bind="value: windHeading, valueUpdate: 'input'"
          />
        </td>
      </tr>
    </tbody>
  </table>
</div>
