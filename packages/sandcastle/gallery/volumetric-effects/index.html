<style>
  @import url(../templates/bucket.css);
</style>
<div id="cesiumContainer" class="fullSize"></div>
<div id="loadingOverlay"><h1>Loading...</h1></div>
<div id="toolbar">
  <table>
    <tbody>
      <tr>
        <td>Volumetric fog</td>
        <td><input type="checkbox" data-bind="checked: fogEnabled" /></td>
      </tr>
      <tr>
        <td>Volumetric clouds</td>
        <td>
          <input type="checkbox" data-bind="checked: cloudsEnabled" />
        </td>
      </tr>
      <tr>
        <td>Cloud coverage</td>
        <td>
          <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            data-bind="value: cloudCoverage, valueUpdate: 'input'"
          />
        </td>
      </tr>
      <tr>
        <td>Fog density</td>
        <td>
          <input
            type="range"
            min="0.5"
            max="5"
            step="0.05"
            data-bind="value: fogDensity, valueUpdate: 'input'"
          />
        </td>
      </tr>
      <tr>
        <td>Fog max distance (km)</td>
        <td>
          <input
            type="range"
            min="5"
            max="80"
            step="1"
            data-bind="value: fogMaxKm, valueUpdate: 'input'"
          />
        </td>
      </tr>
      <tr>
        <td>Sun elevation (°)</td>
        <td>
          <input
            type="range"
            min="-20"
            max="60"
            step="1"
            data-bind="value: sunElev, valueUpdate: 'input'"
          />
        </td>
      </tr>
    </tbody>
  </table>
</div>
