[package]
name = "cesium-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM SIMD spatial acceleration for CesiumJS: frustum culling, radix sort, terrain tessellation, RTE encoding, matrix ops, point cloud processing"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3      # Maximum optimization
lto = true          # Link-time optimization for smallest output
codegen-units = 1   # Single codegen unit for best optimization
strip = true        # Strip debug symbols
panic = "abort"     # No unwinding runtime (smaller binary)

# Configure wasm-opt to accept the WASM features rustc emits in release
# builds. Each `--enable-*` flag whitelists a feature for the binaryen
# validator; without them wasm-opt rejects the module before optimizing.
#
# - simd / bulk-memory: SIMD intrinsics + memory.copy / memory.fill
# - nontrapping-float-to-int: rustc 1.45+ lowers `as i32` casts on f64
#   to `i32.trunc_sat_f64_s` which lives behind this feature flag
# - sign-ext: rustc emits `i32.extend8_s` etc. on byte-level sign extends
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O4",
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
